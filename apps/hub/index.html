<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --paper:#FBF4E6;
  --ink:#101A3D;
  --mute:#5B6488;
  --tile-h:118px;
  --tile-pad:1.1rem;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:1.8rem 1.4rem 3rem;
  display:flex;flex-direction:column;align-items:center;gap:1.4rem;
}

/* 明朝はタイトルと単元名だけ。指示文・注意文はゴシックのまま残す */
.mincho{
  font-family:"Zen Old Mincho","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:900;
  font-feature-settings:"palt" 1;
}

.head{width:min(920px,100%);display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.apptitle{font-size:clamp(1.15rem,3.4vw,1.6rem);letter-spacing:.06em;line-height:1.3}
.who{font-size:.8rem;color:var(--mute);font-weight:600;white-space:nowrap}

.grid{
  display:grid;gap:.85rem;width:min(920px,100%);
  grid-template-columns:repeat(auto-fit,minmax(272px,1fr));
}

/* 枠の大きさは固定。中身が何文字でも高さは動かない */
.tile{
  display:flex;align-items:center;gap:.9rem;
  height:var(--tile-h);
  padding:var(--tile-pad) 1.35rem;
  border:none;border-radius:20px;
  text-decoration:none;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
  transition:transform .08s ease-out,filter .08s;
  overflow:hidden;
}
.tile:hover{filter:brightness(1.04)}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.18)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* 2行まで。3行目は出さず、収まるところまで JS が字を縮める */
.tile .t{
  flex:1 1 auto;min-width:0;
  font-size:2.35rem;line-height:1.16;letter-spacing:.07em;
  max-height:2.32em;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;
  word-break:auto-phrase;      /* 文節で折る（Chrome 119+） */
  overflow-wrap:anywhere;      /* 未対応環境での保険 */
}
.tile .s{
  margin-left:auto;flex:0 0 auto;align-self:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,system-ui,sans-serif;
  font-size:.8rem;font-weight:600;opacity:.82;letter-spacing:.02em;
  text-align:right;white-space:nowrap;
}

.empty,#msg{
  width:min(920px,100%);
  color:var(--mute);font-weight:600;text-align:center;line-height:2;padding:2.6rem 1rem;
}
#msg{display:none}
#msg.on{display:block}
.foot{font-size:.78rem;color:var(--mute);font-weight:600}
/* 教師だけに出る導線。児童の画面の主役ではないので、小さく端に置く */
.tline{font-size:.78rem;margin-top:1.1rem}
.tline a{color:var(--mute);font-weight:700;text-decoration:none;
  border-bottom:1.5px dotted var(--line);padding-bottom:.1rem}
.tline a:hover{color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="head">
  <div class="apptitle mincho" id="title">算数タイムアタック</div>
  <div class="who" id="who"></div>
</div>
<div class="grid" id="grid"></div>
<div id="msg"></div>
<div class="foot" id="foot"></div>
<!-- 教師のアカウントで開いた時だけ出る。児童のアカウントには描かれない -->
<div class="tline" id="teacherLink" style="display:none"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var COLORS = {};

/* 上から順に試す。収まった時点で確定する */
var STEPS = [2.35, 2.0, 1.7, 1.45, 1.25, 1.1];

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* 明朝で描く文字だけを text= で要求する。
   日本語の明朝は1ウェイトで数MB あり、全体を落とすと LTE 機で表示が遅れる。
   ここで送るのはタイトルと単元名の実文字（十数字）だけ。 */
function loadMincho(chars){
  var uniq = Array.from(new Set(String(chars).split(''))).join('').replace(/\s/g, '');
  if(!uniq) return;
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@900'
         + '&display=swap&text=' + encodeURIComponent(uniq);
  document.head.appendChild(l);
}

/* 文字数ではなく実際の描画高さで決める。
   書体・字幅・列幅が変わっても判定が狂わない。 */
function fitOne(el){
  var tile = el.parentNode;
  var cs = getComputedStyle(tile);
  var avail = tile.clientHeight
            - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  for(var i = 0; i < STEPS.length; i++){
    el.style.fontSize = STEPS[i] + 'rem';
    el.style.letterSpacing = (STEPS[i] >= 1.7 ? '.07em' : '.03em');
    var clipped = el.scrollHeight > el.clientHeight + 1;   // 3行目に溢れた
    var tall    = el.offsetHeight > avail + 1;             // タイルからはみ出た
    if(!clipped && !tall) return;
  }
}

function fitAll(){
  var list = document.querySelectorAll('.tile .t');
  for(var i = 0; i < list.length; i++) fitOne(list[i]);
}

function render(r){
  COLORS = r.colors || {};
  var title = r.title || '算数タイムアタック';
  $('title').textContent = title;
  $('who').textContent = r.grade ? (r.grade + 'ねんせい') : '';

  // 判定はサーバー（isTeacher_）。児童には teacherUrl 自体が渡らない。
  // リンクが0件のときも描く。設定を直しに行くのは、まさにその時
  var tl = $('teacherLink');
  if(r.teacher && r.teacherUrl){
    tl.innerHTML = '<a target="_top" href="' + esc(r.teacherUrl) + '">せんせい用の ページ →</a>';
    tl.style.display = '';
  }else{
    tl.style.display = 'none';
  }

  if(!r.links.length){
    $('grid').innerHTML =
      '<div class="empty">いま つかえる れんしゅうは ありません。<br>先生に きいてください。</div>';
    loadMincho(title);
    return;
  }

  var chars = title;
  $('grid').innerHTML = r.links.map(function(l){
    var c = COLORS[l.color] || COLORS.mint || {bg:'#12C48B', fg:'#052A1F'};
    chars += l.title;
    return '<a class="tile" href="'+esc(l.url)+'" target="_blank" rel="noopener" '+
      'style="background:'+c.bg+';color:'+c.fg+'">'+
      '<span class="t mincho">'+esc(l.title)+'</span>'+
      (l.subtitle ? '<span class="s">'+esc(l.subtitle)+'</span>' : '')+
      '</a>';
  }).join('');

  loadMincho(chars);
  $('foot').textContent = 'タップ すると あたらしい ページで ひらきます';

  fitAll();
  /* 明朝が届くと字幅が変わるので測り直す */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
}

var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt); rt = setTimeout(fitAll, 120);
});

google.script.run.withSuccessHandler(function(r){
  if(!r.ok){ $('msg').textContent = r.msg; $('msg').classList.add('on'); return; }
  render(r);
}).withFailureHandler(function(){
  $('msg').textContent = 'つうしんに しっぱいしました。ページを ひらきなおして ください。';
  $('msg').classList.add('on');
}).boot();
</script>
</body>
</html>
