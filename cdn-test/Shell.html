<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: "Noto Sans JP", sans-serif; margin: 16px; font-size: 20px; background: #fff; color: #222; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  #status { font-size: 28px; font-weight: bold; margin: 12px 0; }
  table { border-collapse: collapse; width: 100%; max-width: 640px; }
  th, td { border-bottom: 1px solid #ccc; padding: 10px 8px; text-align: left; }
  th { width: 40%; font-weight: normal; color: #555; }
  .ok { color: #0a6b2e; font-weight: bold; }
  .ok::before { content: "○ "; }
  .ng { color: #b00020; font-weight: bold; }
  .ng::before { content: "× "; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
  button { font-size: 20px; min-height: 56px; padding: 0 20px; border-radius: 8px; border: 2px solid #333; background: #f4f4f4; }
</style>
<script>
  window.CDN_TEST = { mode: '<?= mode ?>', tag: '<?= tag ?>' };
  function remeasure(m) {
    try { localStorage.setItem('cdnTestTap', String(Date.now())); } catch (e) {}
    window.open('<?= execUrl ?>?mode=' + m, '_top');
  }
</script>
</head>
<body>
<h1>読込試験（<?= mode === 'cdn' ? 'jsDelivr' : 'GAS直接' ?>）</h1>
<div id="status">読み込み中…</div>
<table id="res"></table>
<div class="btns">
  <button onclick="remeasure('cdn')">もう一度はかる（jsDelivr）</button>
  <button onclick="remeasure('direct')">もう一度はかる（GAS直接）</button>
</div>
<? if (mode === 'cdn') { ?>
<script src="<?= cdnUrl ?>" onerror="document.getElementById('status').innerHTML='<span class=ng>jsDelivr から読み込めませんでした（フィルタの可能性）</span>'"></script>
<script>
  setTimeout(function () {
    if (document.getElementById('status').textContent === '読み込み中…')
      document.getElementById('status').innerHTML = '<span class="ng">10秒たっても読み込めません</span>';
  }, 10000);
</script>
<? } else { ?>
<?!= include('Inline') ?>
<? } ?>
</body>
</html>
