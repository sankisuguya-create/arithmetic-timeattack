<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プレビュー — 算数タイムアタック</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,"Noto Sans JP",sans-serif;background:#1b1f2a}
  #bar{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;background:#101420;color:#eee}
  #bar a{color:#9fd8c2;text-decoration:none;font-weight:700;padding:.25rem .6rem;border-radius:6px}
  #bar a.on{background:#2b5}
  #bar a.on{color:#04150d}
  #bar .lbl{opacity:.6;font-size:.8rem;margin-left:auto}
  #frame{width:100%;height:calc(100% - 46px);border:0;background:#101420}
  #msg{color:#f3b3b3;font-family:monospace;white-space:pre-wrap;padding:1rem}
  /* 単元メニュー（?unit= なしで開いたとき）。ハブと同じく、カードから各単元へ飛ぶ */
  #menu{display:none;padding:1.2rem;max-width:1100px;margin:0 auto;color:#eee}
  #menu h1{font-size:1.1rem;margin:.2rem 0 1rem;opacity:.8}
  #menu h2{font-size:.95rem;margin:1.2rem 0 .6rem;color:#9fd8c2}
  #menu .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}
  #menu a.card{display:block;background:#252b3b;border:2px solid #3a4260;border-radius:12px;
    padding:.8rem 1rem;color:#eee;text-decoration:none}
  #menu a.card:hover,#menu a.card:focus{border-color:#9fd8c2;outline:none}
  #menu .t{font-weight:800;font-size:1.05rem}
  #menu .id{font-family:monospace;font-size:.78rem;opacity:.55;margin-left:.4rem}
  #menu .m{font-size:.8rem;opacity:.75;margin-top:.4rem;line-height:1.5}
  #menu .err{color:#f3b3b3}
</style>
</head>
<body>
<div id="bar">
  <span style="font-weight:800">プレビュー</span>
</div>
<div id="menu"><h1>単元を えらぶ</h1><div class="grid" id="grid"></div></div>
<iframe id="frame"></iframe>
<script>
/**
 * apps/<unit>/Unit.gs を、Google Apps Script にデプロイせずブラウザだけで見るための開発ツール。
 * common/index.html は改変しない（このファイルが fetch した内容をその場で加工するだけ）。
 *
 * 使い方: このファイルを静的サーバーで配信し、
 *   .../tools/preview/preview.html?unit=weight のように unit= で単元idを指定して開く。
 * 例:
 *   Windows        : powershell -File tools/preview/serve.ps1  (→ http://127.0.0.1:8791/)
 *   Mac/Linux/クラウド: python3 -m http.server 8791 --directory <リポジトリのルート>
 *   どちらもリポジトリのルートを配信すること（相対パスで common/ と apps/ を読みに行くため）。
 *
 * 何をしているか:
 *   1. common/Core.gs から ri_ / pick_（Unit.gs が使う補助関数。docs/ADD_UNIT.md 参照）を取り出す
 *   2. apps/<unit>/Unit.gs をそのまま実行して UNIT を得る（出題ロジックは一切書き直さない）
 *   3. common/index.html を取得し、GAS の外で動かすための2箇所だけを汎用の実装に差し替える
 *      - previewItem()  … ダミーの代わりに UNIT.gen(Math.random, mode) を呼ぶ
 *      - 起動時の else 分岐 … MODES / UNITS / CFG.open を UNIT.modes / UNIT.units から組み立てる
 *   4. 1〜3を1つの HTML として iframe に流し込む
 *
 * 単元を追加してもこのファイルは変更不要（UNIT.gen / UNIT.modes / UNIT.units を読むだけの汎用実装のため）。
 *
 * 自動確定の桁数は、実機の boot() と同じく DIGITCAP に入れて index.html に渡す。
 * index.html 側の経路を実機と共有しているので、digitCap の宣言ミスはここで再現する。
 */

/**
 * 単元の置き場（apps/ からの相対）。学年ごとのフォルダ apps/grade<学年>/<id> に置く。
 * URL の ?unit= は id だけで指定する（学年をまたいで id は一意。tests/lib/kit.cjs が検査する）。
 */
var KNOWN_UNITS = [
  'grade3/kuku', 'grade3/length', 'grade3/weight', 'grade3/divmod',
  'grade3/bignum', 'grade3/decimal', 'grade3/circle', 'grade3/bai',
  'grade5/volume'
];
function unitId_(p) { return p.split('/').pop(); }
function unitPath_(id) {
  for (var i = 0; i < KNOWN_UNITS.length; i++) if (unitId_(KNOWN_UNITS[i]) === id) return KNOWN_UNITS[i];
  return null;
}

function q(name) {
  return new URLSearchParams(location.search).get(name);
}

/**
 * 上の帯。単元を開いているときは「← メニュー」と単元名だけを置く。
 * 単元が増えると横一列のリンクは帯からあふれるので、切り替えはメニューに任せる。
 */
function buildBar(current, title) {
  var bar = document.getElementById('bar');
  if (!current) return;
  var back = document.createElement('a');
  back.href = '?';
  back.textContent = '← メニュー';
  bar.appendChild(back);
  var name = document.createElement('span');
  name.style.fontWeight = '800';
  name.textContent = title || current;
  bar.appendChild(name);
  var lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = 'apps/' + (unitPath_(current) || current) + '/Unit.gs のプレビュー（GAS未デプロイ）';
  bar.appendChild(lbl);
}

/**
 * 単元メニュー。KNOWN_UNITS の各 Unit.gs を読み、タイトルとモード名をカードにする。
 * カードは UNIT.grade（学年）ごとに見出しを分けて並べる。
 * 単元の一覧を自動で集めないのは、serve.ps1 がディレクトリの一覧を返さないため。
 * 単元を足したら KNOWN_UNITS に 'grade<学年>/<id>' を1つ足す（カードの中身は Unit.gs から取るので、ここは書かない）。
 */
async function showMenu() {
  document.getElementById('frame').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
  var menu = document.getElementById('menu'), groups = {};
  document.getElementById('grid').remove();
  var texts = await Promise.allSettled(KNOWN_UNITS.map(function (p) {
    return fetch('../../apps/' + p + '/Unit.gs', NOCACHE).then(function (r) {
      if (!r.ok) throw new Error(r.status); return r.text();
    });
  }));
  var cards = KNOWN_UNITS.map(function (p, i) {
    var id = unitId_(p), grade = 0;
    var a = document.createElement('a');
    a.className = 'card'; a.href = '?unit=' + id;
    var title = id, modes = '', err = '';
    try {
      if (texts[i].status !== 'fulfilled') throw new Error('読み込めません（' + texts[i].reason.message + '）');
      // gen は呼ばない（宣言を読むだけ）。ri_ / pick_ が無くても UNIT の定義までは通る
      var U = new Function(texts[i].value + '\n;return UNIT;')();
      grade = U.grade || 0;
      title = (U.title || id).replace(/\s*タイムアタック！?\s*$/, '');
      modes = (U.modes || []).map(function (m) { return m.id + ' ' + m.name; }).join('　');
    } catch (e) { err = String(e.message || e); }
    a.innerHTML = '<div><span class="t"></span><span class="id"></span></div><div class="m"></div>';
    a.querySelector('.t').textContent = title;
    a.querySelector('.id').textContent = id;
    var m = a.querySelector('.m');
    m.textContent = err || modes;
    if (err) m.className = 'm err';
    return { a: a, grade: grade };
  });
  // 学年ごとに見出しと格子を作る。学年が読めなかった単元は最後の「学年不明」へ
  cards.forEach(function (c) { (groups[c.grade] = groups[c.grade] || []).push(c.a); });
  Object.keys(groups).map(Number).sort(function (x, y) { return (x || 99) - (y || 99); }).forEach(function (g) {
    var h = document.createElement('h2');
    h.textContent = g ? g + '年' : '学年不明（UNIT.grade が無い／読めない）';
    var grid = document.createElement('div');
    grid.className = 'grid';
    groups[g].forEach(function (a) { grid.appendChild(a); });
    menu.appendChild(h); menu.appendChild(grid);
  });
}

function fail(msg) {
  document.getElementById('frame').replaceWith(
    Object.assign(document.createElement('pre'), { id: 'msg', textContent: msg })
  );
}

// 読むのは開発中に書き換わるファイルなので、ブラウザのキャッシュを使わない。
// 古い index.html が残ると、新しい Unit.gs の機能（例: 図 fig）だけが描かれず、原因が見えない
var NOCACHE = { cache: 'no-store' };

async function main() {
  var unit = q('unit');
  if (!unit) { buildBar(null); showMenu(); return; }
  var upath = unitPath_(unit);
  if (!upath) { buildBar(unit); fail('単元 ' + unit + ' は KNOWN_UNITS にありません。preview.html の KNOWN_UNITS に \'grade<学年>/' + unit + '\' を足してください。'); return; }

  var base = '../../';
  var results = await Promise.allSettled([
    fetch(base + 'common/Core.gs', NOCACHE).then(function (r) { if (!r.ok) throw new Error('Core.gs: ' + r.status); return r.text(); }),
    fetch(base + 'apps/' + upath + '/Unit.gs', NOCACHE).then(function (r) { if (!r.ok) throw new Error('apps/' + upath + '/Unit.gs: ' + r.status); return r.text(); }),
    fetch(base + 'common/index.html', NOCACHE).then(function (r) { if (!r.ok) throw new Error('index.html: ' + r.status); return r.text(); })
  ]);

  var errs = results.filter(function (r) { return r.status === 'rejected'; }).map(function (r) { return r.reason.message; });
  if (errs.length) {
    buildBar(unit);
    fail('読み込みに失敗しました。静的サーバーがリポジトリのルートを配信しているか確認してください。\n\n' + errs.join('\n'));
    return;
  }
  var coreText = results[0].value, unitText = results[1].value, uiText = results[2].value;
  var tm = unitText.match(/title:\s*'([^']+)'/);
  buildBar(unit, tm ? tm[1] : unit);

  var riMatch = coreText.match(/function ri_\([^)]*\)\s*\{[^}]*\}/);
  var pickMatch = coreText.match(/function pick_\([^)]*\)\s*\{[^}]*\}/);
  // 学年の色（正本は Core.gs）。実機は boot の返り値で受け取るので、プレビューでは Core.gs から抜き出す
  var accMatch = coreText.match(/var GRADE_ACCENT_ = \{[^}]*\};/), alertMatch = coreText.match(/var ALERT_COLOR_ = '[^']*';/);
  // 床の第二の色の一覧（正本は Core.gs の FLOOR_GEMS_）。単元の floorColor をここから引く
  var gemsMatch = coreText.match(/var FLOOR_GEMS_ = \{[^}]*\};/);
  var gaMatch = coreText.match(/function gradeAccent_\(\) \{[^\n]*\}/), fcMatch = coreText.match(/function floorColor_\(\) \{[\s\S]*?\n\}/);
  // 「？」の印の色（Core.gs の questionColor_ と、その元の GRADE_EXTRA_）。単元の gen が呼ぶ（円と球の図の「？」）
  var extraMatch = coreText.match(/var GRADE_EXTRA_ = \{[^}]*\};/), qcMatch = coreText.match(/function questionColor_\(\) \{[\s\S]*?\n\}/);
  if (!riMatch || !pickMatch) { fail('common/Core.gs から ri_ / pick_ を抽出できませんでした（実装が変わった可能性があります）。'); return; }

  var previewItemRe = /function\s+previewItem\s*\(\)\s*\{[\s\S]*?\n\}/;
  // GAS の外で動くときの分岐（if(SRV){...}else{ BEST=... renderMenu(); show('start'); }）。
  // 目印は else の直後の "BEST=" だけにする。if 側（bootFetch の後の協力の見張りなど）が
  // 増えても外れないように、if 側の中身には依存しない
  var elseBlockRe = /\}else\{\s*BEST=[\s\S]*?renderMenu\(\);\s*show\('start'\);\s*\}/;
  if (!previewItemRe.test(uiText) || !elseBlockRe.test(uiText) || !/function applyBoot\(r, live\)/.test(uiText)) {
    fail('common/index.html の想定していた箇所（previewItem / GAS外の else 分岐 / applyBoot）が見つかりませんでした。index.html の構造が変わった可能性があります。');
    return;
  }

  var newPreviewItem =
    "function previewItem(){\n" +
    "  var m = practice ? pMode : mode;\n" +           // 練習は pMode。mode は本番用で更新されない
    "  var it = UNIT.gen(Math.random, m);\n" +
    "  if(pType){ for(var i=0;i<60 && it.t!==pType;i++) it = UNIT.gen(Math.random, m); }\n" +
    "  return {q:it.q, f:it.f, ans:it.ans, ruler:it.ruler||null, t:it.t||null, dial:it.dial||null,\n" +
    "          rows:it.rows||null, veil:(it.veil == null ? null : it.veil), fig:it.fig||null};\n" +
    "}";

  // Core.gs の boot() が名簿外の試用者（guest）に返すのと同じ形を作り、実機と同じ applyBoot に通す。
  // 画面側の反映（色・床・型の一覧・順次開放の印など）を写さないので、applyBoot が増えても追従する
  var newElseBlock =
    "}else{\n" +
    "  var __ids = (UNIT.modes||[]).map(function(m){ return m.id; });\n" +
    "  var __tbm = {};\n" +                // 型の一覧は Core.gs と同じく gen を回して導出する
    "  __ids.forEach(function(m){ var seen={}, list=[];\n" +
    "    for(var i=0;i<300;i++){ var t=UNIT.gen(Math.random,m).t; if(t&&!seen[t]){seen[t]=true;list.push(t);} }\n" +
    "    __tbm[m]=list; });\n" +
    "  var __set = {}, __defs = UNIT.defaults || {};\n" +   // 教師の上書きは無いので既定値
    "  (UNIT.settings||[]).forEach(function(s){ var v=__defs[s.key]; __set[s.key] = (s.type==='text') ? v : Number(v); });\n" +
    "  var __r = { ok:true, guest:true, name:'', grade:0, limitSec:Number(__defs.limit_sec)||60, missLimit:Number(__defs.miss_limit)||3,\n" +
    "    unit:{ id:UNIT.id, title:UNIT.title + '（プレビュー）', modes:UNIT.modes, grade:UNIT.grade,\n" +
    "      accent:gradeAccent_(), alert:ALERT_COLOR_, q:questionColor_(),\n" +
    "      units:UNIT.units||{}, digitCap:UNIT.digitCap||{}, types:UNIT.types||{}, typesByMode:__tbm,\n" +
    "      scale:UNIT.scale||{}, glyph:UNIT.glyph||{}, slotColor:UNIT.slotColor||{},\n" +
    "      floor2:floorColor_(), floorPattern:UNIT.floorPattern||'penrose' },\n" +
    "    settings:__set, open:{}, locked:{}, best:{}, practiceBest:{}, stars:{}, medals:{}, floor:{min:0, pace:{}} };\n" +
    "  __ids.forEach(function(m){ __r.open[m]=true; __r.best[m]=0; __r.practiceBest[m]=0; __r.stars[m]=0; __r.medals[m]=''; });\n" +
    "  applyBoot(__r);\n" +
    "  show('start');\n" +
    "}";

  // index.html はサーバーでテンプレートとして評価され、単元の id と Core.gs の版が埋め込まれる。プレビューではその場で埋める
  var appIdRe = /<\?!= JSON\.stringify\(String\(UNIT\.id\)\) \?>/;
  if (!appIdRe.test(uiText)) { fail('common/index.html の APP_ID の埋め込み（<?!= JSON.stringify(String(UNIT.id)) ?>）が見つかりませんでした。'); return; }
  var verRe = /<\?!= ENGINE_VER \?>/, verM = coreText.match(/var ENGINE_VER = (\d+)/);
  if (!verRe.test(uiText) || !verM) { fail('common/index.html の版の埋め込み（<?!= ENGINE_VER ?>）または Core.gs の ENGINE_VER が見つかりませんでした。'); return; }
  var patchedUi = uiText.replace(appIdRe, JSON.stringify(unit)).replace(verRe, verM[1]).replace(previewItemRe, newPreviewItem).replace(elseBlockRe, newElseBlock);

  var helperScript =
    '<script>\n' +
    riMatch[0] + '\n' +
    (accMatch ? accMatch[0] : 'var GRADE_ACCENT_ = {};') + '\n' +
    (alertMatch ? alertMatch[0] : "var ALERT_COLOR_ = '';") + '\n' +
    (gemsMatch ? gemsMatch[0] : 'var FLOOR_GEMS_ = {};') + '\n' +
    (extraMatch ? extraMatch[0] : 'var GRADE_EXTRA_ = {};') + '\n' +
    (qcMatch ? qcMatch[0] : "function questionColor_(){ return '#FFFFFF'; }") + '\n' +
    (gaMatch ? gaMatch[0] : 'function gradeAccent_(){ return GRADE_ACCENT_[UNIT.grade] || GRADE_ACCENT_[3]; }') + '\n' +
    (fcMatch ? fcMatch[0] : "function floorColor_(){ return ''; }") + '\n' +
    pickMatch[0] + '\n' +
    unitText + '\n' +
    '<' + '/script>\n';

  var finalHtml = patchedUi.replace('<script>', helperScript + '<script>');

  document.getElementById('frame').srcdoc = finalHtml;
}

main().catch(function (e) { fail(String(e && e.stack || e)); });
</script>
</body>
</html>
