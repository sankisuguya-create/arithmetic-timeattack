<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--paper:#F7F7F4;--ink:#101728;--mint:#35D0A5;--mute:#9AA0B0;--line:#DFDFD8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  font-variant-numeric:tabular-nums;padding:2.2rem 1.5rem;line-height:1.6}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.35rem;font-weight:800;margin-bottom:.3rem}
.sub{font-size:.82rem;color:var(--mute);margin-bottom:2rem;line-height:1.9;word-break:break-all}
.sub b{color:var(--ink)}
.box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1.1rem}
h2{font-size:.72rem;letter-spacing:.18em;color:var(--mute);font-weight:700;margin-bottom:1.1rem}
.row{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.row label{flex:1;font-size:.94rem;font-weight:600}
.row .note{display:block;font-size:.74rem;color:var(--mute);font-weight:400}
input[type=number],input[type=text]{width:7rem;padding:.5rem .7rem;border:1.5px solid var(--line);
  border-radius:8px;font:inherit;font-weight:700;text-align:right;background:var(--paper)}
input.wide{width:100%;text-align:left;font-weight:400}
input:focus{outline:none;border-color:var(--ink)}
button{font:inherit;font-weight:700;padding:.65rem 1.3rem;border:none;border-radius:9px;
  background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:.7rem;align-items:center;margin-top:1.2rem;flex-wrap:wrap}
.stat{font-size:.82rem;color:var(--mute);min-height:1.3rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.76rem;color:var(--mute);padding:.4rem .3rem;font-weight:700}
td{padding:.55rem .3rem;border-top:1.5px solid var(--line)}
.legend{font-size:.8rem;line-height:1.7;color:var(--mute);margin-bottom:.4rem}
.legend b{color:var(--ink);font-weight:700}
.legend .n{display:inline-block;width:1.2rem;font-weight:800;color:var(--ink)}
.tips{font-size:.84rem;line-height:1.9}
.tips b{color:var(--ink)}
code{background:#EDEDE8;padding:.1rem .35rem;border-radius:4px;font-size:.86em}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1">設定・分析</h1>
  <div class="sub" id="sub">設定と分析</div>

  <div class="box">
    <h2>せってい</h2>
    <div class="row">
      <label>制限時間<span class="note">秒。15〜300 の範囲で</span></label>
      <input id="limit_sec" type="number" min="15" max="300">
    </div>
    <div class="row">
      <label>正答提示までの誤答回数<span class="note">この回数まちがえたら答えを見せて次へ</span></label>
      <input id="miss_limit" type="number" min="1" max="9">
    </div>
    <div class="row">
      <label>未習熟とみなす時間<span class="note">ミリ秒。換算は九九より時間がかかるので既定5000</span></label>
      <input id="slow_ms" type="number" min="1000" max="20000" step="500">
    </div>
    <div class="row">
      <label>キーの間隔<span class="note">画面下の数字キーの横間隔(px)。0〜40</span></label>
      <input id="key_gap" type="number" min="0" max="40">
    </div>
    <div class="row" style="display:block">
      <label style="display:block;margin-bottom:.5rem">この画面を開ける教師
        <span class="note">メールアドレスをカンマ区切りで。所有者は常に開けます</span></label>
      <input id="teachers" class="wide" type="text">
    </div>
    <div id="settingRows"></div>
    <div class="bar">
      <button id="save">設定を保存</button>
      <span class="stat" id="saveStat"></span>
    </div>
  </div>

  <div class="box">
    <h2>クラスごとの もーど</h2>
    <p style="font-size:.88rem;margin-bottom:.4rem">
      <b>チェックを入れたモードだけが、そのクラスの児童に表示されます。</b>
      初期状態はすべてオフです。学年による自動の解禁はありません。
    </p>
    <div style="margin:1rem 0;overflow-x:auto">
      <div class="stat" id="clsLoading">読み込み中…</div>
      <table id="clsTable" style="display:none">
        <thead><tr id="clsHead"><th>クラス</th><th>人数</th></tr></thead>
        <tbody id="clsBody"></tbody>
      </table>
    </div>
    <div class="legend" id="clsLegend"></div>
    <div class="bar">
      <button id="clsSave">クラス設定を保存</button>
      <button id="clsAll" class="ghost">ぜんぶオン</button>
      <button id="clsNone" class="ghost">ぜんぶオフ</button>
      <span class="stat" id="clsStat"></span>
    </div>
  </div>

  <div class="box">
    <h2>ぶんせき</h2>
    <p style="font-size:.88rem;margin-bottom:1rem">
      <b>毎晩23時台に自動で集計されます。</b>授業直後にすぐ見たいときだけ押してください。
    </p>
    <div class="bar">
      <button id="agg" class="ghost">いま集計する</button>
      <span class="stat" id="aggStat"></span>
    </div>
  </div>

  <div class="box">
    <h2>シートの読み方</h2>
    <div class="tips" id="tips"></div>
  </div>
</div>

<script>
function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

var BASE_KEYS = ['limit_sec','miss_limit','slow_ms','key_gap','teachers'];
var KEYS = BASE_KEYS.slice();
var SETTINGS = [];

google.script.run.withSuccessHandler(function(r){
  var c = r.config, u = r.unit;
  document.getElementById('h1').textContent = u.teacherTitle || u.title || '設定・分析';
  // どの写しを操作しているかを出す。版を入れ替えた直後、古い写しと新しい写しは
  // 見た目が同じで、取り違えても画面には何も出ない（児童側が空になるだけ）
  var w = r.where || {};
  document.getElementById('sub').innerHTML = w.file
    ? 'このページが設定しているのは <b>' + esc(w.file) + '</b>' +
      (w.url ? '<br>児童に配る URL: <code>' + esc(w.url) + '</code>' : '')
    : '設定と分析';
  document.getElementById('tips').innerHTML = u.tips || '';

  // 単元が宣言した設定欄。Core も teacher.html もキーの意味を知らない。
  // 単元が持たなければ何も描かない（九九の画面に長さの欄は出ない）。
  SETTINGS = u.settings || [];
  document.getElementById('settingRows').innerHTML = SETTINGS.map(function(s){
    var attr = (s.type === 'text')
      ? 'type="text" class="wide"'
      : 'type="number"' +
        (s.min  !== undefined ? ' min="'+s.min+'"'   : '') +
        (s.max  !== undefined ? ' max="'+s.max+'"'   : '') +
        (s.step !== undefined ? ' step="'+s.step+'"' : '');
    return '<div class="row"><label>'+s.label+
      (s.note ? '<span class="note">'+s.note+'</span>' : '')+
      '</label><input id="'+s.key+'" '+attr+'></div>';
  }).join('');
  KEYS = KEYS.concat(SETTINGS.map(function(s){ return s.key; }));

  KEYS.forEach(function(k){
    var el = document.getElementById(k);
    if(el) el.value = c[k];
  });
}).withFailureHandler(function(e){
  document.getElementById('saveStat').textContent = '読み込めません: ' + e.message;
}).getConfigForUI();

document.getElementById('save').onclick = function(){
  var btn = this; btn.disabled = true;
  document.getElementById('saveStat').textContent = '保存中…';
  var obj = {};
  var textKeys = { teachers: 1 };
  SETTINGS.forEach(function(s){ if(s.type === 'text') textKeys[s.key] = 1; });
  KEYS.forEach(function(k){
    var el = document.getElementById(k);
    if(!el) return;
    obj[k] = textKeys[k] ? el.value : Number(el.value);
  });
  google.script.run.withSuccessHandler(function(){
    btn.disabled = false;
    document.getElementById('saveStat').textContent = '保存しました（次に開いた児童から反映）';
  }).withFailureHandler(function(e){
    btn.disabled = false;
    document.getElementById('saveStat').textContent = 'エラー: ' + e.message;
  }).saveConfig(obj);
};

document.getElementById('agg').onclick = function(){
  var btn = this; btn.disabled = true;
  document.getElementById('aggStat').textContent = '集計中…';
  google.script.run.withSuccessHandler(function(m){
    btn.disabled = false;
    document.getElementById('aggStat').textContent = m;
  }).withFailureHandler(function(e){
    btn.disabled = false;
    document.getElementById('aggStat').textContent = 'エラー: ' + e.message;
  }).aggregate();
};

/* ===== クラスごとの公開モード =====
 * 列見出しはモード番号にして、名前と例は表の下の凡例に置く。
 * モード名（「かんさん きほん」など）をそのまま6列並べると表が横に伸びて読めない。 */
var CLS = { classes: [], modes: [], hasNeeds: false };

function renderClasses(){
  var head = document.getElementById('clsHead');
  head.innerHTML = '<th>クラス</th><th>人数</th>' +
    CLS.modes.map(function(m, i){
      return '<th style="text-align:center">'+(i+1)+'</th>';
    }).join('') +
    (CLS.hasNeeds ? '<th style="text-align:center">じゅん<br>ばん解除</th>' : '');

  document.getElementById('clsBody').innerHTML = CLS.classes.map(function(c){
    var cells = CLS.modes.map(function(m){
      return '<td style="text-align:center"><input type="checkbox" data-cls="'+c.cls+
             '" data-m="'+m.id+'"'+(c.modes[m.id]?' checked':'')+'></td>';
    }).join('');
    if(CLS.hasNeeds){
      cells += '<td style="text-align:center"><input type="checkbox" data-cls="'+c.cls+
               '" data-seq="1"'+(c.seqOff?' checked':'')+'></td>';
    }
    return '<tr><td style="font-weight:800">'+c.grade+'年 '+c.room+'組</td>'+
      '<td style="color:var(--mute)">'+c.n+'</td>'+cells+'</tr>';
  }).join('');

  document.getElementById('clsLegend').innerHTML =
    CLS.modes.map(function(m, i){
      return '<div><span class="n">'+(i+1)+'</span><b>'+m.name+'</b>'+
             (m.desc ? '　'+m.desc : '')+'</div>';
    }).join('') +
    (CLS.hasNeeds
      ? '<div style="margin-top:.4rem">「じゅんばん解除」を入れると、前のモードの回数に関係なく'+
        'すべて使えるようになります。</div>'
      : '');
}

/* 画面のチェックを CLS に取り込む。表を描き直す前に必ず呼ぶ（未保存の操作を失わない） */
function collectClasses(){
  var map = {};
  CLS.classes.forEach(function(c){ map[c.cls] = c; });
  document.querySelectorAll('#clsBody input[type=checkbox]').forEach(function(cb){
    var c = map[cb.dataset.cls];
    if(!c) return;
    if(cb.dataset.seq) c.seqOff = cb.checked;
    else c.modes[cb.dataset.m] = cb.checked;
  });
}

google.script.run.withSuccessHandler(function(r){
  CLS = r;
  document.getElementById('clsLoading').style.display = 'none';
  document.getElementById('clsTable').style.display = '';
  renderClasses();
}).withFailureHandler(function(e){
  document.getElementById('clsLoading').textContent = '読み込めません: ' + e.message;
}).listClasses();

document.getElementById('clsSave').onclick = function(){
  var btn = this; btn.disabled = true;
  document.getElementById('clsStat').textContent = '保存中…';
  collectClasses();
  google.script.run.withSuccessHandler(function(m){
    btn.disabled = false;
    document.getElementById('clsStat').textContent = m + '（次に開いた児童から反映）';
  }).withFailureHandler(function(e){
    btn.disabled = false;
    document.getElementById('clsStat').textContent = 'エラー: ' + e.message;
  }).saveClassConfig(CLS.classes);
};

function setAll(v){
  collectClasses();
  CLS.classes.forEach(function(c){
    CLS.modes.forEach(function(m){ c.modes[m.id] = v; });
  });
  renderClasses();
  document.getElementById('clsStat').textContent =
    (v ? 'ぜんぶオンにしました' : 'ぜんぶオフにしました') + '（保存を押すと確定）';
}
document.getElementById('clsAll').onclick  = function(){ setAll(true); };
document.getElementById('clsNone').onclick = function(){ setAll(false); };
</script>
</body>
</html>
