<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--paper:#F7F7F4;--ink:#101728;--mint:#35D0A5;--mute:#9AA0B0;--line:#DFDFD8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  font-variant-numeric:tabular-nums;padding:2.2rem 1.5rem;line-height:1.6}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.35rem;font-weight:800;margin-bottom:.3rem}
.sub{font-size:.82rem;color:var(--mute);margin-bottom:2rem;line-height:1.9;word-break:break-all}
/* 行き先。設定を直したあと、シートと児童画面の両方を見に行くことになる */
.golinks{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 .9rem}
.golinks a{font-size:.84rem;font-weight:700;text-decoration:none;color:var(--ink);
  border:1.5px solid var(--line);border-radius:9px;padding:.45rem .9rem;background:#fff}
.golinks a:hover{border-color:var(--ink)}
.sub b{color:var(--ink)}
.box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1.1rem}
/* チェックを触ってから保存するまでの間。押し忘れると児童の画面が変わらないので、
   「まだ効いていない」ことを箱ごと見せる */
.box.dirty{border-color:#E8A33D;box-shadow:0 0 0 3px rgba(232,163,61,.16)}
.box.dirty #clsSave{background:#E8A33D}
h2{font-size:.72rem;letter-spacing:.18em;color:var(--mute);font-weight:700;margin-bottom:1.1rem}
.row{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.row label{flex:1;font-size:.94rem;font-weight:600}
.row .note{display:block;font-size:.74rem;color:var(--mute);font-weight:400}
input[type=number],input[type=text]{width:7rem;padding:.5rem .7rem;border:1.5px solid var(--line);
  border-radius:8px;font:inherit;font-weight:700;text-align:right;background:var(--paper)}
input.wide{width:100%;text-align:left;font-weight:400}
input:focus{outline:none;border-color:var(--ink)}
button{font:inherit;font-weight:700;padding:.65rem 1.3rem;border:none;border-radius:9px;
  background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:.7rem;align-items:center;margin-top:1.2rem;flex-wrap:wrap}
.stat{font-size:.82rem;color:var(--mute);min-height:1.3rem}
/* 失敗は目立たせる。灰色の小さい字で出していると、保存できていないことに気づかず
   「児童側の不具合」を探しに行くことになる */
.stat.bad{color:#C0392B;font-weight:700;font-size:.9rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.76rem;color:var(--mute);padding:.4rem .3rem;font-weight:700}
td{padding:.55rem .3rem;border-top:1.5px solid var(--line)}
.legend{font-size:.8rem;line-height:1.7;color:var(--mute);margin-bottom:.4rem}
.legend b{color:var(--ink);font-weight:700}
.legend .n{display:inline-block;width:1.2rem;font-weight:800;color:var(--ink)}
.tips{font-size:.84rem;line-height:1.9}
.tips b{color:var(--ink)}
code{background:#EDEDE8;padding:.1rem .35rem;border-radius:4px;font-size:.86em}

/* ===== ぶんせきタブ =====
 * 色は色覚特性を越えて見分けられる既定トークンだけを使い、
 * 「色を外しても意味が残る」形（閾値線・記号・数値の併記）にする。 */
:root{--cat1:#0F5EA8;--cat2:#C86A00;--alert:#C0330A;--fillA:#D7E8F8}
.wrap.wide{max-width:900px}
.tabs{display:flex;gap:.15rem;border-bottom:2px solid var(--line);margin-bottom:1.3rem}
.tab{font:inherit;font-weight:700;font-size:1rem;padding:.55rem 1.5rem;background:none;
  border:none;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--mute);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--cat1);background:var(--fillA)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .9rem}
.chip{padding:.3rem .8rem;border-radius:999px;border:1.5px solid var(--line);
  font-size:.82rem;font-weight:700;cursor:pointer;background:#fff;color:var(--mute)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec{margin-top:1.6rem}
.sec:first-child{margin-top:.4rem}
h3.sec{font-size:.9rem;font-weight:800;color:var(--ink);letter-spacing:0}
.note{font-size:.76rem;color:var(--mute);margin:.1rem 0 .5rem;line-height:1.6}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .blbl{font-size:11.5px;fill:var(--ink);font-weight:600}
.chart .bval{font-size:11px;fill:var(--mute);font-weight:700}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .thr{stroke:var(--alert);stroke-width:1.6;stroke-dasharray:4 3}
.chart .thl{font-size:11px;fill:var(--alert);font-weight:800}
/* ヒートマップは単一色相（青）の明度段階。値そのものもセルに書くので色だけに頼らない */
table.heat{border-collapse:collapse;font-size:.8rem;min-width:100%}
.heat th{font-size:.72rem;color:var(--mute);padding:.35rem .3rem;font-weight:700;
  text-align:center;line-height:1.35;border-top:none}
.heat td{padding:.42rem .3rem;text-align:center;border-top:1.5px solid var(--line);font-weight:700}
.heat td.nm,.heat th.nm{text-align:left;font-weight:700}
.heat td.wk,.heat th.wk{color:var(--mute);font-weight:600;white-space:nowrap}
.heat td.none{color:var(--mute);font-weight:400}
.heat td.h1{background:#E3F0FA}
.heat td.h2{background:#A9CCE7}
.heat td.h3{background:var(--cat1);color:#fff}
.heat td .wb{color:var(--alert)}
.heat td.h3 .wb{color:#fff}
.wob{color:var(--alert)}
.heatlg{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;font-size:.74rem;color:var(--mute);margin-top:.6rem}
.heatlg .sw{display:inline-block;width:.85rem;height:.85rem;border-radius:3px;border:1px solid var(--line);
  vertical-align:-1px;margin-right:.25rem}
.wrong td{font-size:.82rem}
.wrong td.n{font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1">設定・分析</h1>
  <div class="golinks" id="golinks"></div>
  <div class="sub" id="sub">設定と分析</div>

  <nav class="tabs" role="tablist">
    <button class="tab on" id="tabSet" role="tab" aria-current="page">せってい</button>
    <button class="tab" id="tabAna" role="tab">ぶんせき</button>
  </nav>

  <div id="pageSet">
  <div class="box">
    <h2>せってい</h2>
    <div class="row">
      <label>制限時間<span class="note">秒。15〜300 の範囲で</span></label>
      <input id="limit_sec" type="number" min="15" max="300">
    </div>
    <div class="row">
      <label>正答提示までの誤答回数<span class="note">この回数まちがえたら答えを見せて次へ</span></label>
      <input id="miss_limit" type="number" min="1" max="9">
    </div>
    <div class="row">
      <label>未習熟とみなす時間<span class="note">ミリ秒。換算は九九より時間がかかるので既定5000</span></label>
      <input id="slow_ms" type="number" min="1000" max="20000" step="500">
    </div>
    <div class="row">
      <label>キーの間隔<span class="note">画面下の数字キーの横間隔(px)。0〜40</span></label>
      <input id="key_gap" type="number" min="0" max="40">
    </div>
    <div class="row" style="display:block">
      <label style="display:block;margin-bottom:.5rem">この画面を開ける教師
        <span class="note">@edu.nishi.or.jp のアカウントと所有者は、書かなくても開けます。
        別ドメインの人を足すときだけ、メールアドレスをカンマ区切りで</span></label>
      <input id="teachers" class="wide" type="text">
    </div>
    <div id="settingRows"></div>
    <div class="bar">
      <button id="save">設定を保存</button>
      <span class="stat" id="saveStat"></span>
    </div>
  </div>

  <div class="box" id="clsBox">
    <h2>クラスごとの もーど</h2>
    <p style="font-size:.88rem;margin-bottom:.4rem">
      <b>チェックを入れたモードだけが、そのクラスの児童に表示されます。</b>
      初期状態はすべてオフです。学年による自動の解禁はありません。
    </p>
    <div style="margin:1rem 0;overflow-x:auto">
      <div class="stat" id="clsLoading">読み込み中…</div>
      <table id="clsTable" style="display:none">
        <thead><tr id="clsHead"><th>クラス</th><th>人数</th></tr></thead>
        <tbody id="clsBody"></tbody>
      </table>
    </div>
    <div class="stat bad" id="clsOrphan" style="display:none;line-height:1.8;margin-bottom:.8rem"></div>
    <div class="legend" id="clsLegend"></div>
    <div class="bar">
      <button id="clsSave">クラス設定を保存</button>
      <button id="clsAll" class="ghost">ぜんぶオン</button>
      <button id="clsNone" class="ghost">ぜんぶオフ</button>
      <button id="clsReload" class="ghost">いまの状態を読み直す</button>
      <span class="stat" id="clsStat"></span>
    </div>
  </div>

  <div class="box">
    <h2>ぶんせき</h2>
    <p style="font-size:.88rem;margin-bottom:1rem">
      <b>毎晩23時台に自動で集計されます。</b>授業直後にすぐ見たいときだけ押してください。
    </p>
    <div class="bar">
      <button id="agg" class="ghost">いま集計する</button>
      <span class="stat" id="aggStat"></span>
    </div>
  </div>

  <div class="box">
    <h2>シートの読み方</h2>
    <div class="tips" id="tips"></div>
  </div>
  </div><!-- /pageSet -->

  <div id="pageAna" style="display:none">
  <div class="box">
    <h2>ぶんせき</h2>
    <div class="chips" id="anaChips"></div>
    <div class="stat" id="anaStat">読み込み中…</div>
    <div id="anaBody"></div>
    <div class="bar">
      <button class="ghost" id="anaReload">いまの記録で読み直す</button>
    </div>
  </div>
  </div><!-- /pageAna -->
</div>

<script>
/* いま設定している写しを名指す。名前は写しても同じになるので、ID まで出す
   （スプレッドシートの URL の /d/ と /edit のあいだと突き合わせる） */
function showWhere(w){
  w = w || {};
  if(!w.file) return;
  document.getElementById('golinks').innerHTML =
    (w.sheetUrl ? '<a href="' + esc(w.sheetUrl) + '">スプレッドシートを開く</a>' : '') +
    (w.url      ? '<a href="' + esc(w.url) + '">児童の画面を見る</a>' : '');
  document.getElementById('sub').innerHTML =
    'このページが設定しているのは <b>' + esc(w.file) + '</b>' +
    (w.id  ? '<br>スプレッドシート ID: <code>' + esc(w.id) + '</code>' : '') +
    (w.url ? '<br>児童に配る URL: <code>' + esc(w.url) + '</code>' : '');
}

function setStat(id, text, bad){
  var el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle('bad', !!bad);
}

function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

var BASE_KEYS = ['limit_sec','miss_limit','slow_ms','key_gap','teachers'];
var KEYS = BASE_KEYS.slice();
var SETTINGS = [];

google.script.run.withSuccessHandler(function(r){
  var c = r.config, u = r.unit;
  document.getElementById('h1').textContent = u.teacherTitle || u.title || '設定・分析';
  // どの写しを操作しているかを出す。版を入れ替えた直後、古い写しと新しい写しは
  // 見た目が同じで、取り違えても画面には何も出ない（児童側が空になるだけ）
  showWhere(r.where);
  document.getElementById('tips').innerHTML = u.tips || '';

  // 単元が宣言した設定欄。Core も teacher.html もキーの意味を知らない。
  // 単元が持たなければ何も描かない（九九の画面に長さの欄は出ない）。
  SETTINGS = u.settings || [];
  document.getElementById('settingRows').innerHTML = SETTINGS.map(function(s){
    var attr = (s.type === 'text')
      ? 'type="text" class="wide"'
      : 'type="number"' +
        (s.min  !== undefined ? ' min="'+s.min+'"'   : '') +
        (s.max  !== undefined ? ' max="'+s.max+'"'   : '') +
        (s.step !== undefined ? ' step="'+s.step+'"' : '');
    return '<div class="row"><label>'+s.label+
      (s.note ? '<span class="note">'+s.note+'</span>' : '')+
      '</label><input id="'+s.key+'" '+attr+'></div>';
  }).join('');
  KEYS = KEYS.concat(SETTINGS.map(function(s){ return s.key; }));

  KEYS.forEach(function(k){
    var el = document.getElementById(k);
    if(el) el.value = c[k];
  });
}).withFailureHandler(function(e){
  setStat('saveStat', '読み込めません: ' + e.message, true);
}).getConfigForUI();

document.getElementById('save').onclick = function(){
  var btn = this; btn.disabled = true;
  setStat('saveStat', '保存中…', false);
  var obj = {};
  var textKeys = { teachers: 1 };
  SETTINGS.forEach(function(s){ if(s.type === 'text') textKeys[s.key] = 1; });
  KEYS.forEach(function(k){
    var el = document.getElementById(k);
    if(!el) return;
    obj[k] = textKeys[k] ? el.value : Number(el.value);
  });
  google.script.run.withSuccessHandler(function(){
    btn.disabled = false;
    setStat('saveStat', '保存しました（次に開いた児童から反映）', false);
  }).withFailureHandler(function(e){
    btn.disabled = false;
    setStat('saveStat', '保存できませんでした: ' + e.message, true);
  }).saveConfig(obj);
};

document.getElementById('agg').onclick = function(){
  var btn = this; btn.disabled = true;
  setStat('aggStat', '集計中…', false);
  google.script.run.withSuccessHandler(function(m){
    btn.disabled = false;
    setStat('aggStat', m, false);
  }).withFailureHandler(function(e){
    btn.disabled = false;
    setStat('aggStat', 'できませんでした: ' + e.message, true);
  }).aggregate();
};

/* ===== クラスごとの公開モード =====
 * 列見出しはモード番号にして、名前と例は表の下の凡例に置く。
 * モード名（「かんさん きほん」など）をそのまま6列並べると表が横に伸びて読めない。 */
var CLS = { classes: [], modes: [], hasNeeds: false };

function renderClasses(){
  var head = document.getElementById('clsHead');
  head.innerHTML = '<th>クラス</th><th>人数</th>' +
    CLS.modes.map(function(m, i){
      return '<th style="text-align:center">'+(i+1)+'</th>';
    }).join('') +
    (CLS.hasNeeds ? '<th style="text-align:center">じゅん<br>ばん解除</th>' : '');

  document.getElementById('clsBody').innerHTML = CLS.classes.map(function(c){
    var cells = CLS.modes.map(function(m){
      return '<td style="text-align:center"><input type="checkbox" data-cls="'+c.cls+
             '" data-m="'+m.id+'"'+(c.modes[m.id]?' checked':'')+'></td>';
    }).join('');
    if(CLS.hasNeeds){
      cells += '<td style="text-align:center"><input type="checkbox" data-cls="'+c.cls+
               '" data-seq="1"'+(c.seqOff?' checked':'')+'></td>';
    }
    return '<tr><td style="font-weight:800">'+c.grade+'年 '+c.room+'組</td>'+
      '<td style="color:var(--mute)">'+c.n+'</td>'+cells+'</tr>';
  }).join('');

  document.getElementById('clsLegend').innerHTML =
    CLS.modes.map(function(m, i){
      return '<div><span class="n">'+(i+1)+'</span><b>'+m.name+'</b>'+
             (m.desc ? '　'+m.desc : '')+'</div>';
    }).join('') +
    (CLS.hasNeeds
      ? '<div style="margin-top:.4rem">「じゅんばん解除」を入れると、前のモードの回数に関係なく'+
        'すべて使えるようになります。</div>'
      : '');
}

/* class_config に行はあるのに、名簿から作られるクラスと名前が合わない場合。
   シートには TRUE が入っているのに児童には1つも開かない、という状態が起きる。
   どちらの画面にも出ないので、名前を並べて見せる */
function showOrphans(list){
  var el = document.getElementById('clsOrphan');
  if(!list || !list.length){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = '<b>class_config に、名簿と対応しない行があります: ' +
    list.map(esc).join('・') + '</b><br>' +
    '名簿の「学年」「組」の表記と一致していません。' +
    'この行のチェックは児童には効きません。名簿の表記をそろえてから、' +
    'もう一度「クラス設定を保存」を押してください。';
}

/* チェックを触ったが、まだ保存していない状態。
   「クラス設定を保存」と、上の「設定を保存」は別のボタンで、
   押し間違えても今までは何も起きなかった。触った時点で見た目を変えて知らせる */
var clsDirty = false;
function setDirty(v){
  clsDirty = v;
  document.getElementById('clsBox').classList.toggle('dirty', v);
  document.getElementById('clsSave').textContent =
    v ? 'クラス設定を保存（未保存）' : 'クラス設定を保存';
}

/* 画面のチェックを CLS に取り込む。表を描き直す前に必ず呼ぶ（未保存の操作を失わない） */
function collectClasses(){
  var map = {};
  CLS.classes.forEach(function(c){ map[c.cls] = c; });
  document.querySelectorAll('#clsBody input[type=checkbox]').forEach(function(cb){
    var c = map[cb.dataset.cls];
    if(!c) return;
    if(cb.dataset.seq) c.seqOff = cb.checked;
    else c.modes[cb.dataset.m] = cb.checked;
  });
}

/**
 * シートの現状を読み込む。
 *
 * この画面は開いた時と保存した時にしか読まない。開いたままのタブは、
 * シートを直接直しても、別の端末から保存しても、いつまでも古いまま残る。
 * 「保存が効いていない」と「画面が古い」は見分けがつかないので、
 * 読み直す手段を画面に置く。
 */
var clsBound = false;
function loadClasses(){
  google.script.run.withSuccessHandler(function(r){
    CLS = r;
    document.getElementById('clsLoading').style.display = 'none';
    document.getElementById('clsTable').style.display = '';
    renderClasses();
    showWhere(r.where);
    showOrphans(r.orphans);
    setDirty(false);
    if(!clsBound){
      clsBound = true;
      document.getElementById('clsBody').addEventListener('change', function(){ setDirty(true); });
    }
  }).withFailureHandler(function(e){
    document.getElementById('clsLoading').textContent = '読み込めません: ' + e.message;
    setStat('clsStat', '読み込めません: ' + e.message, true);
  }).listClasses();
}
loadClasses();

document.getElementById('clsReload').onclick = function(){
  // 未保存のチェックがあるときは、押した人の操作を黙って捨てない
  if(clsDirty && !confirm('保存していないチェックがあります。シートの内容で上書きしますか？')) return;
  setStat('clsStat', '読み直しています…', false);
  loadClasses();
  setTimeout(function(){ setStat('clsStat', 'シートの内容を読み直しました', false); }, 400);
};

document.getElementById('clsSave').onclick = function(){
  var btn = this; btn.disabled = true;
  setStat('clsStat', '保存中…', false);
  collectClasses();
  google.script.run.withSuccessHandler(function(r){
    btn.disabled = false;
    // サーバーは書いたあとに読み戻した内容を返す。画面はその読み戻しで描き直す。
    // 送った内容のまま描くと、書けていない時に「オンになっている画面」が残り、
    // 次に開いた時だけ元に戻っているように見える
    if(r && r.classes){ CLS.classes = r.classes; renderClasses(); }
    setDirty(false);
    setStat('clsStat', ((r && r.msg) || r) + '（次に開いた児童から反映）', false);
  }).withFailureHandler(function(e){
    btn.disabled = false;
    setStat('clsStat', '保存できませんでした: ' + e.message, true);
  }).saveClassConfig(CLS.classes);
};

function setAll(v){
  collectClasses();
  CLS.classes.forEach(function(c){
    CLS.modes.forEach(function(m){ c.modes[m.id] = v; });
  });
  renderClasses();
  setDirty(true);
  setStat('clsStat', (v ? 'ぜんぶオンにしました' : 'ぜんぶオフにしました') +
                     '（保存を押すと確定）', false);
}
document.getElementById('clsAll').onclick  = function(){ setAll(true); };
document.getElementById('clsNone').onclick = function(){ setAll(false); };

/* ===== ぶんせきタブ =====
 * 集計はサーバー側（getAnalysis）が log から一括で作って返す。
 * ここでは受け取った結果を描くだけ。色と形は「色を外しても意味が残る」
 * 二重符号化（閾値線・▲・数値の併記）で組む。 */
var ANA = null, anaScope = null, anaAsked = false;

function showPage(p){
  var ana = (p === 'ana');
  document.getElementById('tabSet').classList.toggle('on', !ana);
  document.getElementById('tabAna').classList.toggle('on', ana);
  document.getElementById(ana ? 'tabAna' : 'tabSet').setAttribute('aria-current', 'page');
  document.getElementById(ana ? 'tabSet' : 'tabAna').removeAttribute('aria-current');
  document.getElementById('pageSet').style.display = ana ? 'none' : '';
  document.getElementById('pageAna').style.display = ana ? '' : 'none';
  document.querySelector('.wrap').classList.toggle('wide', ana);
  if(ana && !anaAsked){ anaAsked = true; loadAnalysis(false); }
}
document.getElementById('tabSet').onclick = function(){ showPage('set'); };
document.getElementById('tabAna').onclick = function(){ showPage('ana'); };

function loadAnalysis(fresh){
  document.getElementById('anaStat').textContent = '集計中…';
  document.getElementById('anaStat').classList.remove('bad');
  google.script.run.withSuccessHandler(function(r){
    ANA = r;
    if(anaScope === null){
      // 初期表示はいちばん記録の多いクラス（たいてい自分の学級）。全体はチップ1つで行ける
      var best = '', n = -1;
      (r.classes || []).forEach(function(c){ if(c.trials > n){ n = c.trials; best = c.cls; } });
      anaScope = best || 'all';
    }
    renderAnalysis();
  }).withFailureHandler(function(e){
    document.getElementById('anaBody').innerHTML = '';
    setStat('anaStat', '読み込めません: ' + e.message, true);
  }).getAnalysis(!!fresh);
}
document.getElementById('anaReload').onclick = function(){ loadAnalysis(true); };
document.getElementById('anaChips').addEventListener('click', function(e){
  if(e.target.dataset && e.target.dataset.s){ anaScope = e.target.dataset.s; renderAnalysis(); }
});

/* ---- 横棒グラフ（型ごとの指標）。破線=めやす。超えた棒だけ橙 ---- */
function hbarChart(rows, opt){
  if(!rows.length) return '<div class="note">この期間に記録がありません。</div>';
  var W = 860, lblW = 168, padR = 76, rowH = 26, top = 24;
  var H = top + rows.length*rowH + 10;
  var max = 0; rows.forEach(function(r){ if(r.val > max) max = r.val; });
  var smax = Math.max(max, opt.thresh || 0) * 1.06 || 1;
  var x0 = lblW, x1 = W - padR;
  function px(v){ return x0 + (x1 - x0) * v / smax; }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  if(opt.thresh){
    var tx = px(opt.thresh);
    s += '<line class="thr" x1="' + tx + '" y1="' + (top - 8) + '" x2="' + tx + '" y2="' + (H - 4) + '"/>' +
         '<text class="thl" x="' + tx + '" y="' + (top - 11) + '" text-anchor="middle">' + esc(opt.threshTxt) + '</text>';
  }
  rows.forEach(function(r, i){
    var y = top + i*rowH;
    s += '<text class="blbl" x="' + (x0 - 8) + '" y="' + (y + rowH*0.68) + '" text-anchor="end">' + esc(r.label) + '</text>' +
         '<rect x="' + x0 + '" y="' + (y + 4) + '" width="' + Math.max(px(r.val) - x0, 1.5) + '" height="' + (rowH - 9) +
           '" rx="3" fill="' + (r.over ? '#C86A00' : '#0F5EA8') + '"><title>' + esc(r.label + ' ' + r.valTxt) + '</title></rect>' +
         '<text class="bval" x="' + (px(r.val) + 6) + '" y="' + (y + rowH*0.68) + '">' + esc(r.valTxt) + '</text>';
  });
  return s + '</svg>';
}

/* ---- 日ごとの実施回数。記録の無い日は0本の柱として描く ---- */
function colChart(daily){
  if(!daily || !daily.length) return '<div class="note">この期間に記録がありません。</div>';
  var W = 860, H = 128, padL = 30, padB = 16, padT = 16;
  var map = {}, max = 0;
  daily.forEach(function(x){ map[x[0]] = x[1]; if(x[1] > max) max = x[1]; });
  var days = [];
  var d = new Date(daily[0][0] + 'T00:00:00');
  var last = new Date(daily[daily.length-1][0] + 'T00:00:00');
  while(d <= last){
    var key = d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    days.push([key, map[key] || 0]);
    d.setDate(d.getDate() + 1);
  }
  var n = days.length, bw = (W - padL - 4) / n, base = H - padB;
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
          '<line class="ax" x1="' + padL + '" y1="' + base + '" x2="' + W + '" y2="' + base + '"/>' +
          '<text class="bval" x="2" y="' + (padT - 4) + '">最大 ' + max + '回</text>';
  days.forEach(function(day, i){
    var h = (base - padT) * (max ? day[1]/max : 0);
    var x = padL + i*bw + bw*0.16;
    s += '<rect x="' + x + '" y="' + (base - h) + '" width="' + Math.max(bw*0.68, 1) +
         '" height="' + Math.max(h, 0.5) + '" rx="1.5" fill="#0F5EA8">' +
         '<title>' + esc(day[0].slice(5).replace('-', '/')) + ' ' + day[1] + '回</title></rect>';
    if(i === 0 || i === n-1 || day[0].slice(-2) === '01' || (n > 14 && i % 7 === 0)){
      s += '<text class="bval" x="' + (padL + i*bw + bw/2) + '" y="' + (H - 3) +
           '" text-anchor="middle" style="font-size:9px">' + esc(day[0].slice(5).replace('-', '/')) + '</text>';
    }
  });
  return s + '</svg>';
}

/* ---- ヒートマップ。セルは秒＋濃淡。ゆらぎ超過は▲を添える（色だけに頼らない） ---- */
function heatCls(ms){
  if(!ms) return 'none';
  var r = ms / ANA.slowTk;
  if(r <= 0.7) return '';
  if(r <= 1.0) return 'h1';
  if(r <= 1.5) return 'h2';
  return 'h3';
}
function heatCell(o, wobble){
  if(!o || !o.n) return '<td class="none" title="記録なし">–</td>';
  var mark = (wobble && o.n >= 5 && o.cv > ANA.wobble) ? '<span class="wb">▲</span>' : '';
  return '<td class="' + heatCls(o.ms) + '" title="' + o.n + '回・ゆらぎ' + o.cv + '%">' +
         (o.ms/1000).toFixed(1) + mark + '</td>';
}
function heatLegend(r){
  var t = (r.slowTk/1000).toFixed(1), t15 = (r.slowTk*1.5/1000).toFixed(1);
  return '<div class="heatlg">' +
    '<span><span class="sw" style="background:#fff"></span>速い（めやすの7割以下）</span>' +
    '<span><span class="sw" style="background:#E3F0FA"></span>めやす以内</span>' +
    '<span><span class="sw" style="background:#A9CCE7"></span>' + t + '秒超</span>' +
    '<span><span class="sw" style="background:#0F5EA8"></span>' + t15 + '秒超</span>' +
    '<span class="wob">▲ ゆらぎ' + r.wobble + '%超（5回以上の型）</span>' +
    '<span>– 記録なし</span></div>';
}
function heatHead(r, extra){
  return '<thead><tr><th class="nm">' + esc(extra.first) + '</th>' +
    r.order.map(function(ty){ return '<th>' + esc(r.types[ty] || ty) + '</th>'; }).join('') +
    extra.tail + '</tr></thead>';
}
function classHeat(r){
  if(!(r.classes || []).length)
    return '<h3 class="sec">クラスごとの平均想起時間</h3><div class="note">roster に児童が登録されていません。</div>';
  var rows = r.classes.map(function(c){
    var sc = r.scopes[c.cls];
    var tds = r.order.map(function(ty){ return heatCell(sc && sc.types ? sc.types[ty] : null); }).join('');
    return '<tr><td class="nm">' + esc(c.label) + '</td>' + tds +
           '<td class="wk">' + c.trials + '回</td></tr>';
  }).join('');
  return '<h3 class="sec">クラスごとの平均想起時間</h3>' +
    '<div class="note">セルの数値は秒（初打鍵までの平均）。濃いほど遅い。</div>' +
    '<div style="overflow-x:auto"><table class="heat">' +
    heatHead(r, { first: 'クラス', tail: '<th>試行</th>' }) +
    '<tbody>' + rows + '</tbody></table></div>' + heatLegend(r);
}
function studentHeat(r, ck){
  var kids = (r.students || {})[ck] || [];
  if(!kids.length)
    return '<h3 class="sec">児童ごとの平均想起時間</h3>' +
           '<div class="note">このクラスには名簿の児童がいません。</div>';
  var rows = kids.map(function(k){
    var tds = r.order.map(function(ty){ return heatCell(k.t[ty], true); }).join('');
    var wob = k.wobble
      ? '<span class="' + (k.wobble > r.wobble ? 'wob' : '') + '">' + k.wobble + '% ' + esc(k.wobbleType) + '</span>'
      : '';
    return '<tr><td class="nm">' + (k.no || '') + '　' + esc(k.name) + '</td>' + tds +
           '<td class="wk">' + wob + '</td><td class="wk">' + k.miss + '</td><td class="wk">' + k.tries + '</td></tr>';
  }).join('');
  return '<h3 class="sec">児童ごとの平均想起時間</h3>' +
    '<div class="note">セルの数値は秒（初打鍵までの平均）。濃いほど遅い。' +
    '<b>この表は児童に見せないでください</b>（「遅い」を名指すと隠す行動が出ます）。</div>' +
    '<div style="overflow-x:auto"><table class="heat">' +
    heatHead(r, { first: '児童', tail: '<th>ゆらぎ</th><th>誤答</th><th>試行</th>' }) +
    '<tbody>' + rows + '</tbody></table></div>' + heatLegend(r);
}
function wrongTable(list, types){
  if(!list || !list.length) return '<div class="note">この期間に誤答の記録はありません。</div>';
  return '<table class="wrong"><thead><tr><th>問題型</th><th>もんだい</th><th>正しい答え</th><th>こたえた値</th><th>回数</th></tr></thead><tbody>' +
    list.map(function(w){
      return '<tr><td>' + esc(types[w.t] || w.t) + '</td><td>' + esc(w.tag) + '</td>' +
             '<td>' + esc(w.ok || '–') + '</td><td>' + esc(w.ng) + '</td><td class="n">' + w.n + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<div class="note">全件はスプレッドシートの mistakes シートにあります。</div>';
}

function renderAnalysis(){
  var r = ANA; if(!r) return;
  document.getElementById('anaChips').innerHTML =
    '<span class="chip' + (anaScope === 'all' ? ' on' : '') + '" data-s="all">全体</span>' +
    (r.classes || []).map(function(c){
      return '<span class="chip' + (anaScope === c.cls ? ' on' : '') + '" data-s="' + esc(c.cls) + '">' + esc(c.label) + '</span>';
    }).join('');

  var sc = r.scopes[anaScope] || { trials: 0, types: {}, wrongTop: [], daily: [] };
  var meta = '';
  if(anaScope !== 'all'){
    var info = null, kids = (r.students || {})[anaScope] || [];
    (r.classes || []).forEach(function(c){ if(c.cls === anaScope) info = c; });
    if(info){
      var active = kids.filter(function(k){ return k.tries > 0; }).length;
      meta = '・' + active + '/' + info.n + '名に記録あり';
    }
  }
  document.getElementById('anaStat').textContent =
    r.span + '・' + sc.trials + ' 試行' + meta + '・' + r.at + ' 時点（名簿の児童だけが対象）';

  var thrSec = r.slowTk / 1000;
  var recall = r.order.filter(function(ty){ return sc.types[ty] && sc.types[ty].n > 0; })
    .map(function(ty){
      var o = sc.types[ty];
      return { label: r.types[ty] || ty, val: o.ms/1000,
               valTxt: (o.ms/1000).toFixed(1) + '秒・' + o.n + '回', over: o.ms > r.slowTk };
    }).sort(function(a, b){ return b.val - a.val; });
  var miss = r.order.filter(function(ty){ return sc.types[ty] && sc.types[ty].miss > 0; })
    .map(function(ty){
      return { label: r.types[ty] || ty, val: sc.types[ty].miss,
               valTxt: sc.types[ty].miss + '件', over: false };
    }).sort(function(a, b){ return b.val - a.val; });

  document.getElementById('anaBody').innerHTML =
    '<h3 class="sec">型ごとの平均想起時間</h3>' +
    '<div class="note">問題が出てから最初のキーを押すまでの平均（打鍵は含まない）。' +
      '破線は未習熟のめやす ' + thrSec.toFixed(1) + '秒。</div>' +
    hbarChart(recall, { thresh: thrSec, threshTxt: 'めやす ' + thrSec.toFixed(1) + '秒' }) +
    '<h3 class="sec">型ごとの誤答の数</h3>' +
    hbarChart(miss, {}) +
    '<h3 class="sec">日ごとの実施回数</h3>' +
    colChart(sc.daily) +
    '<h3 class="sec">よくある誤答</h3>' +
    wrongTable(sc.wrongTop, r.types) +
    (anaScope === 'all' ? classHeat(r) : studentHeat(r, anaScope));
}
</script>
