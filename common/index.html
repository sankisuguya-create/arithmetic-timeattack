<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#F7F7F4; --ink:#101728; --chalk:#FFFFFF;
  /* --acc は学年の進みの色、--q は「？」の印の色。boot で Core.gs から上書きする（既定は3年） */
  --acc:#35D0A5; --alert:#FF1A30; --q:#F1B1E4;
  --mute:#9AA0B0; --line:#DFDFD8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  user-select:none;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- 開始 ---------- */
/* isolation で重なりの基準を #start に閉じ、背景の床（z-index:-1）を中身の後ろに置く */
#start{align-items:center;justify-content:center;gap:1.4rem;padding:1.3rem;isolation:isolate}
/* 背景の床（成長する図形）。描くのは状態が変わった時だけ。操作は受け取らない */
.floorcv{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.floorcv[hidden]{display:none}
.apptitle{font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:800;letter-spacing:.02em}
.timelede{font-size:clamp(1.5rem,5.5vw,2.3rem);font-weight:800;color:var(--acc);margin-top:-.6rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem;width:min(760px,96vw)}
/* モード名は必ず1段に収める。折り返すと、どのモードを選んでいるかが読み取りにくい。
   そのために上段＝番号＋モード名、下段＝記号とベストの2段組にしてある。 */
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:.85rem 1.1rem;display:block;transition:border-color .12s;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card .top{display:flex;align-items:center;gap:.75rem}
.card .k{font-size:1.05rem;font-weight:800;color:#fff;background:var(--ink);
  width:1.9rem;height:1.9rem;border-radius:7px;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
.card .t{font-size:1.18rem;font-weight:800;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.card .bot{display:flex;align-items:flex-end;gap:.5rem;margin-top:.35rem;
  padding-left:2.65rem;min-height:1.6rem}
/* 学級内＝絵文字のメダル、個人内＝ミントの★n。記号の種類で区別する */
.card .medal{font-size:1.25rem;line-height:1.2}
.card .star{font-size:.9rem;font-weight:800;color:var(--acc);line-height:1.4;
  letter-spacing:.02em;white-space:nowrap}
.pbest{font-size:.62rem;color:var(--mute);font-weight:700;margin-top:.2rem}
.card .hsbox{margin-left:auto;display:flex;align-items:baseline;gap:.35rem}
.card .hs{font-size:1.7rem;font-weight:800;line-height:1}
.card .hs.none{color:var(--line)}
.card .hslbl{font-size:.58rem;color:var(--mute);letter-spacing:.08em;font-weight:700}
/* 順次開放でまだ届いていないモード。消さずに薄く出す
   （順序が見えないと「順番にやる」こと自体が伝わらない）。
   教師が非公開にしたモードはそもそも一覧に出さない。 */
.card.locked{opacity:.5;background:#F7F8FA;cursor:default}
.card.locked .k{background:var(--line)}
.card .lock{font-size:.72rem;color:var(--mute);font-weight:700;line-height:1.3}
.hint{font-size:.88rem;color:var(--mute);font-weight:600}
/* 教師だけに出る導線。児童の画面の主役ではないので、小さく端に置く */
.tline{font-size:.78rem}
.tline a{color:var(--mute);font-weight:700;text-decoration:none;
  border-bottom:1.5px dotted var(--line);padding-bottom:.1rem}
.tline a:hover{color:var(--ink)}
/* 公開されたモードが0件のとき。読み込み中と見分けがつく大きさで出す */
.empty{grid-column:1/-1;background:#fff;border:1.5px dashed var(--line);border-radius:14px;
  padding:1.6rem 1.2rem;text-align:center;font-size:1.05rem;font-weight:700;line-height:1.9}
.tap{cursor:pointer;padding:.35rem .6rem;border-radius:8px;display:inline-block}
.tap:hover{background:#EDEDE8;color:var(--ink)}
.prow{width:min(620px,94vw);border-top:1.5px dashed var(--line);padding-top:1.1rem;
  display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap}
.pbtn{display:flex;align-items:center;gap:.7rem;background:none;border:none;
  cursor:pointer;font:inherit;color:var(--ink);padding:.3rem .6rem;border-radius:10px}
.pbtn:hover{background:#EDEDE8}
.pbtn .k{font-size:.92rem;font-weight:800;color:var(--mute);background:#E7E7E1;
  width:1.7rem;height:1.7rem;border-radius:6px;display:flex;align-items:center;justify-content:center}
.pbtn .t{font-size:1rem;font-weight:800}
.pbtn .s{font-size:.72rem;color:var(--mute);font-weight:600}

/* ---------- 選択画面 ---------- */
.pick{align-items:center;justify-content:center;gap:1.3rem;padding:1.3rem}
.picktitle{font-size:1.15rem;font-weight:800}
.opgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem;width:min(460px,92vw)}
.timegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem;width:min(420px,90vw)}
.timecard{background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:1.2rem 1rem;text-align:center;cursor:pointer;transition:border-color .12s}
.timecard:hover{border-color:var(--ink)}
.timecard .k{display:inline-flex;align-items:center;justify-content:center;
  width:1.7rem;height:1.7rem;border-radius:6px;background:var(--ink);color:#fff;
  font-size:.95rem;font-weight:800;margin-bottom:.55rem}
.timecard .t{font-size:1.12rem;font-weight:800}
.timecard .s{font-size:.75rem;color:var(--mute);font-weight:600;margin-top:.15rem}
.szbtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.7rem;
  text-align:center;font-size:1.05rem;font-weight:800;cursor:pointer;transition:border-color .12s}
.szbtn:hover{border-color:var(--ink)}
.szbtn .k2{display:inline-flex;align-items:center;justify-content:center;width:1.4rem;height:1.4rem;
  border-radius:5px;background:#E7E7E1;color:var(--mute);font-size:.78rem;margin-right:.45rem}

/* ---------- プレイ ---------- */
#play{background:var(--ink);color:var(--chalk)}
#bar{height:28px;background:var(--acc);width:100%;transform-origin:left center;will-change:transform}
/* のこり時間が少ないとき：帯を赤の斜線にする。色（赤）と模様（斜線）の両方で変わるので、
   色覚に関係なく変化が見える */
#bar.low{background:repeating-linear-gradient(135deg,var(--alert) 0 14px,var(--ink) 14px 24px)}
#bar.hidden{visibility:hidden}
.hud{display:flex;justify-content:space-between;align-items:center;padding:.6rem 1.5rem .1rem}
.hud .medal{font-size:1.7rem;line-height:1}
.hud .label{font-size:1.05rem;font-weight:700;color:#6E7690}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding-bottom:2vh}

/* 正答数は式の左上、Enterと同じミント */
.cntbox{position:absolute;left:12.7%;top:calc(50% - clamp(3rem,8vw,4.2rem));
  transform:translate(-50%,-50%);text-align:center;color:var(--acc);font-weight:800;
  line-height:.85;pointer-events:none}
.cntbox .n{display:block;font-size:clamp(3rem,7vw,5.6rem)}
.cntbox .l{font-size:.8rem;color:#6E7690;font-weight:700;letter-spacing:.14em;margin-top:.35rem}
.cntbox .n.bump{animation:bump .18s ease-out}
@keyframes bump{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}

/* 打ち終えた答えの残像。自動確定は最後の打鍵と同時に次の問題を描くので、
   児童は自分が書いた答えを1フレームも見られない。次の問題は遅らせずに描き、
   答えだけを別の層に写して上へ抜けさせる（止める時間はゼロ）。
   色は学年の色（--acc）。同じ瞬間に跳ねる「せいかい」の数と同じ色で、新しい色は足さない。
   色だけに意味を持たせない：上へ動くことと薄れることが同時に起きている */
.ghost{position:absolute;pointer-events:none;z-index:2;color:var(--acc);
  font-weight:800;line-height:1.15;white-space:nowrap;
  display:flex;align-items:baseline;
  transform:translate(-50%,0);animation:ghostup .42s ease-out forwards}
/* 単位ラベルの無い問題（rows）は、欄の値が地続きになって読めない
   （④なら「五253」が 5・25・3 か 5・2・53 か分からない）。欄のあいだを空ける */
.ghost.sp{gap:.3em}
@keyframes ghostup{
  0%{opacity:.9;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-.55em)}
}
.ghost .u{font-size:.62em;color:var(--acc);opacity:.7;margin-right:.22em;margin-left:.02em}

/* 式：数字は大きく、単位はやや小さく落ち着かせる */
.eq{font-size:clamp(2.2rem,7.5vw,4.6rem);font-weight:800;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;gap:.12em}
.eq .line{display:flex;align-items:baseline;gap:.06em;white-space:nowrap}
.eq .line.ans{gap:.06em}
/* 長い数や文章は、二段表示でトークンの境目を折り返す。 */
.eq:not(.oneline){max-width:100%}
.eq:not(.oneline) .line{max-width:100%;flex-wrap:wrap;justify-content:center;white-space:normal}
.eq.oneline{flex-direction:row;align-items:baseline}
.eq.oneline .line{display:contents}
.eq .u{font-size:.62em;color:#8C93AC;margin-right:.22em;margin-left:.02em}

/* 単元が描く図（q.fig）。上に問いと欄、残りの高さを図に回す。
   stage の min-height:0 はまきじゃくと同じ理由（図に合わせて stage が膨らみ、
   数字キーが押しつぶされるのを止める）。 */
#play.fig-mode .stage{min-height:0;padding-top:40px}
#play.fig-mode .eq{width:100%;height:100%;justify-content:flex-start;gap:.3rem}
#play.fig-mode .line.ans{flex:0 0 auto;font-size:clamp(1.5rem,3.6vw,2.4rem);gap:.25em}
#play.fig-mode .cntbox{left:8px;right:auto;top:6px;transform:none;position:absolute;margin-left:0}
#play.fig-mode.hand-left .cntbox{left:auto;right:8px}
#play.fig-mode .cntbox .n{font-size:clamp(1.8rem,3.6vw,2.6rem)}
#play.fig-mode .cntbox .l{font-size:.6rem;margin-top:.15rem}
.figbox{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.figbox svg{display:block;max-width:100%;max-height:100%;width:100%;height:100%}

/* まきじゃく */
.ruler{width:min(98%,1300px);margin:0 auto}
.ruler svg{display:block;width:100%;height:auto}
.rulerwrap{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:100%}
/* まきじゃく・文字盤は .eq を画面幅いっぱいに広げる。
   .eq は既定では内容の幅までしか広がらず、SVG は幅を持たないので、
   指定が無いと置換要素の既定（300px）まで縮む＝目盛りが読めない。 */
#play.ruler-mode .eq{width:100%}
/* 巻き尺は画面いっぱいに広げるので、正答数は上の隅に小さく逃がす。
   利き手側（キーを打つ手）と反対の隅に置く：手や腕で隠れないため。 */
#play.ruler-mode .cntbox{left:8px;right:auto;top:6px;transform:none;
  position:absolute;margin-left:0}
#play.ruler-mode.hand-left:not(.dial-mode) .cntbox{left:auto;right:8px}
#play.ruler-mode .cntbox .n{font-size:clamp(1.8rem,3.6vw,2.6rem)}
#play.ruler-mode .cntbox .l{font-size:.6rem;margin-top:.15rem}
/* まきじゃくは高さで詰まる。児童機の画面は768pxでも、タブ・アドレス欄・
   ブックマーク・タスクバーを引くと表示領域は600px前後しかなく、横幅いっぱいに
   広げた図は縦がはみ出す（body は overflow:hidden なので、はみ出す＝矢印や
   m の表示が切れる）。入る範囲でいちばん大きく描くために、高さの上限を与える。 */
#play.ruler-mode:not(.dial-mode) .eq{height:100%}
#play.ruler-mode:not(.dial-mode) .rulerwrap{height:100%;justify-content:center;gap:0}
#play.ruler-mode:not(.dial-mode) .ruler{height:100%;display:flex;align-items:center;justify-content:center}
#play.ruler-mode:not(.dial-mode) .ruler svg{max-height:100%}
/* min-height:0 ＝ 図の大きさに合わせて stage が膨らむのを止める。既定の min-height:auto
   では stage が中身の高さまで伸び、あふれたぶん数字キーが押しつぶされる（stage は
   flex-basis:0 で縮まず、キー側の flex-shrink が効くため）。先に表示領域から stage の
   高さを決め、その中で図を縮める。
   キーの高さはめもりモードだけ3段ぶんから2段ぶんへ。数字は上端に描かれ、残りは
   当たり判定でしかないので、見え方は変わらない。空いた高さはまきじゃくに回る。 */
#play.ruler-mode:not(.dial-mode) .stage{padding-top:48px;min-height:0}
#play.ruler-mode:not(.dial-mode) #pad{height:calc(clamp(3rem,8vw,4.2rem) * 2)}
/* 答えは上の帯（中央）へ。正答数と同じ高さに置き、まきじゃくとは重ねない。
   図の下に置くと、その行のぶんだけ図に使える高さが減る＝まきじゃくが小さくなる。
   小さくても数字を残すのは、「めもり ぜんぶ」が Enter 確定で、打ち間違いに
   気づく手がかりが無いと誤りに気づけないまま送信することになるため。 */
#play.ruler-mode:not(.dial-mode) .line.ans{position:absolute;top:8px;left:50%;
  transform:translateX(-50%);font-size:1.7rem;gap:.1em;white-space:nowrap}
#play.ruler-mode:not(.dial-mode) .line.ans .slot{border-bottom:none;color:var(--acc);min-width:1.4ch}
/* ---- はかりの文字盤。上から「正答数＋式」「拡大と文字盤」「数字キー」の3段 ----
   一周200目盛りの文字盤は、児童機（表示領域600px前後）では目盛り間が3.7pxしかなく、
   文字盤を設定上限まで大きくしても5.9pxにしかならない。読める密度にするには画面の
   96%相当が要り、入らない。だから文字盤とは別に、針先付近を切り取った拡大窓を並べる。
   拡大窓を左・文字盤を右に固定するのは、拡大窓が「先に見るほう」だから。
   利き手では入れ替えない（打つ手は下の数字キーにあり、図には掛からない）。 */
#play.dial-mode .hud{padding:2px 12px 0}
#play.dial-mode .hud .medal{font-size:1.2rem}
#play.dial-mode .hud .label{font-size:.9rem}
#play.dial-mode .stage{display:block;padding:0;min-height:0}
#play.dial-mode .eq{width:100%;height:100%;justify-content:flex-start;gap:0;
  font-size:clamp(1.4rem,3.4vw,2rem)}
/* 式は上の帯へ。図の下に置くと、その行のぶんだけ図が縮む。
   下線は残す（まきじゃくと違って Enter 確定の欄が2つあり、どちらを打っているかが要る） */
#play.dial-mode .line.ans{flex:0 0 auto;align-items:center;min-height:46px;
  gap:.1em;white-space:nowrap}
#play.dial-mode .cntbox{left:8px;top:2px;right:auto;transform:none;position:absolute;margin-left:0}
#play.dial-mode .cntbox .n{font-size:clamp(1.5rem,3vw,2.1rem)}
#play.dial-mode .cntbox .l{font-size:.58rem;margin-top:.1rem}
/* 図の段。高さは残りぜんぶ。拡大窓も文字盤も正方形／円なので、幅ではなく高さで決まる。
   dial_size は上限としてのみ効く（既定では段の高さのほうが先に効く）。 */
#play.dial-mode .dialrow{flex:1 1 auto;min-height:0;display:flex;
  align-items:center;justify-content:center;gap:clamp(10px,2.4vw,40px)}
#play.dial-mode .dialzoom,#play.dial-mode .dialfull{height:100%;display:flex;align-items:center}
#play.dial-mode .dialzoom svg,#play.dial-mode .dialfull svg{height:100%;width:auto;display:block}
/* 拡大窓。文字盤に描く枠と同じ色・同じ太さにして、どこを切り取っているかを対応させる */
/* 窓の外（＝はかりのふちの向こう）は文字盤のクリームではなく画面の地色。
   ここをクリームにすると、ふちの外まで文字盤が続いているように見える。 */
#play.dial-mode .dialzoom{border:3px solid #3A4260;border-radius:6px;background:var(--ink);
  overflow:hidden}
#play.dial-mode #pad{height:calc(clamp(3rem,8vw,4.2rem) * 2)}
.eq .op{color:#5C6480;margin:0 .22em}
.eq .slot{color:var(--chalk);border-bottom:.08em solid #3A4260;min-width:2.2ch;
  display:inline-block;text-align:center;cursor:pointer}
/* 目立たせる欄。色（--slotc）と下線の太さの2つで示す。
   .cur と .reveal はこのあとに来るので、いま打っている欄と正答表示が上書きできる。
   class 名に key を使わないこと。.key は画面キーボードのもので、
   見た目を拾うだけでなく、クリックの closest('.key') にも引っかかる */
.eq .slot.accent{color:var(--slotc);border-bottom-color:var(--slotc);border-bottom-width:.16em;
  background:transparent;background:color-mix(in srgb, var(--slotc) 20%, transparent);
  border-radius:.1em .1em 0 0;padding:0 .06em}
.eq .slot.cur{border-bottom-color:var(--acc)}
/* 正しい答えの表示（2回目のまちがいから）は赤。下の「こたえは ○」の文字と一緒に出す */
.eq.reveal .slot{color:var(--alert);border-bottom-color:var(--alert)}
/* 覆い。前の段が通るまで、次の段を読ませない。
   中身は消さずに visibility で隠す。表示を消すと外れた瞬間に式の幅が変わり、
   児童は同じ式をもう一度読み直すことになる */
.eq .line.veiled{position:relative}
.eq .line.veiled > *{visibility:hidden}
.eq .line.veiled::after{content:'';position:absolute;inset:-.06em -.18em;border-radius:.12em;
  background:#1E2740;border:.06em dashed #3A4260}
.footnote{text-align:center;padding-bottom:.8rem;font-size:.82rem;color:#4A5270;
  font-weight:600;height:1.2rem}
#missline{position:absolute;left:20%;right:20%;bottom:calc(clamp(3rem,8vw,4.2rem) * 3 + 1.6rem);
  height:3px;background:var(--alert);border-radius:2px;opacity:0;pointer-events:none}
/* まちがいは赤い「×」を線の上に出す（赤は必ず形と一緒に使う） */
#missline::after{content:'×';position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  color:var(--alert);font-size:2.4rem;font-weight:800;line-height:1}
#missline.on{opacity:.9;transition:opacity .18s ease-out}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:var(--ink);color:var(--chalk);font-size:clamp(6rem,22vw,12rem);font-weight:800;z-index:5}
#countdown.on{display:flex}

/* 画面キー：横一列の縦長柱。数字は上端、当たり判定は画面下端まで */
#pad{display:flex;gap:.5rem;justify-content:center;align-items:stretch;
  padding:0 1rem;flex-wrap:nowrap;height:calc(clamp(3rem,8vw,4.2rem) * 3)}
.key{flex:0 0 auto;width:clamp(3rem,8vw,4.2rem);
  display:flex;align-items:flex-start;justify-content:center;padding-top:.55rem;
  background:#232B44;color:var(--chalk);border-radius:12px 12px 0 0;
  font-size:clamp(1.3rem,3.6vw,1.9rem);font-weight:800;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.key.del{background:#39415C;font-size:clamp(1rem,2.6vw,1.4rem)}
.key.down{background:#05070E}

/* テンキー配置（右利き=tr / 左利き=tl） */
#play.layout-tr .stage,#play.layout-tl .stage{position:absolute;top:28px;bottom:0;width:66.6%}
#play.layout-tr .stage{left:0}
#play.layout-tl .stage{right:0}
#play.layout-tr .cntbox,#play.layout-tl .cntbox{left:20%;top:18%}
#play.layout-tr #pad,#play.layout-tl #pad{position:absolute;top:28px;bottom:0;width:33.4%;

<script>

/** 学年の色を画面に入れる。値は Core.gs（GRADE_ACCENT_ 等）が正本で、ここは受け取るだけ */
function setPalette_(accent, alert, q){

 *  - 育つ演出は本番を終えてメニューに戻った時の1回だけ。増えた菱形だけを描き足す

function floorOn_(){ return uset_('floor_on', 0) === 1; }
/** 標準の1分あたりに増える枚数 ＝ 1正答あたりの育ち（教師の設定）× 基準の速さ（1分20問。Core.gs の FLOOR_REF_PER_MIN_ と同じ）。

 * 次回の起動で古い控えから描いたときに縮んで見えないよう、控えも書き換える
 */
function floorAdd(mode, n){
  n = Number(n) || 0; if(n <= 0) return;
  var pace = Number(FLOOR.pace[mode]) || 20;

function floorFam_(hex){
  var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex||'').trim());

  return [0, -0.1, 0.14, -0.18, 0.24].map(function(k){
    return c.map(function(v){ return Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k)); }).join(',');
  });

/* ---- 図形の生成器 ----

/**
 * 成長する図形 — 生成器
 *
 * 生成器は「画面の大きさと育ち始める点」を受け取り、タイルの配列を返すだけの純粋な関数。
 * 並べ替え・文字の際の薄め・3層の育ち・描画は、使う側の共通エンジンが受け持つ（SPEC.md）。
 *
 *   make(g) → [{ p: [[x,y], ...], cls: 1|0, dir: 0..4 }, ...]
 *     g   = { W, H, ox, oy, edge, margin }
 *           W,H     画面の大きさ（CSS px）
 *           ox,oy   育ち始める点
 *           edge    タイル1枚の目安の大きさ（px）
 *           margin  分割の途中で捨てる判定に使う余白（px。edge×2 が目安）
 *     p   閉じた多角形の頂点（最後の点から最初の点へ閉じる）。1枚まるごと描く単位
 *     cls 1＝色1（学年の色）の層で塗る、0＝色2（サイトの色）の層で塗る
 *     dir 同じ色の中の明暗の段（0..4）。宝石の切子面のように少しずつ変える
 *

    [[0, 0], [g.W, 0], [0, g.H], [g.W, g.H]].forEach(function (p) {
      var dx = p[0] - g.ox, dy = p[1] - g.oy; f = Math.max(f, Math.sqrt(dx * dx + dy * dy));
    });

  }
  function onScreen(g, pts, m) {
    var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];

    return ((Math.round(ang / (Math.PI / 5)) % 5) + 5) % 5;
  }

  /* ペンローズ（P3）。ロビンソン三角形の置き換えを繰り返し、辺BCを共有する2枚を組にして菱形にする。
     色1＝太い菱形（72°）、色2＝細い菱形（36°） */
  function penrose(g) {
    var R = g.edge, k = 0, far = farthest(g), T = [], i, j;
    while (R < far + g.edge * 2) { R *= PHI; k++; }
    for (i = 0; i < 10; i++) {

          c = [g.ox + R * Math.cos((2 * i + 1) * Math.PI / 10), g.oy + R * Math.sin((2 * i + 1) * Math.PI / 10)];
      if (i % 2 === 0) { var t = b; b = c; c = t; }
      T.push([0, [g.ox, g.oy], b, c]);
    }

      var N = [];
      for (j = 0; j < T.length; j++) {

      var fills = floorBucket_(), lines = floorBucket_();
      for(; s.i < upto; s.i++){ var t = s.list[s.i]; if(s.fill) fills.add(floorFillKey_(t), t); lines.add(floorLineKey_(t), t); }
      fills.fill(ctx); lines.stroke(ctx, 1);   // 塗った菱形にも輪郭を引き直し、焼き付け後と同じ見え方にする
    });
    if(el < END){ F.anim = requestAnimationFrame(frame); return; }
    F.anim = 0;
    floorDraw_(g1);
    ctx.clearRect(0, 0, F.W, F.H);
  });
}

function floorSame_(a, b){ return a && b && a.line === b.line && a.thick === b.thick && a.thin === b.thin; }

/**
 * メニューが見えている間に呼ぶ。必要な時だけ描く。
 * animate が真なら増えた分を演出つきで、偽なら黙って描き直す
 * （起動直後やサーバーの値で追いついた時は演出しない。演出は本番を終えて戻った時だけ）
 */
function floorRender_(animate){
  var F = FLOOR, on = floorOn_();
  $('floorBase').hidden = !on; $('floorGrow').hidden = !on;
  if(!on || scr !== 'start') return;
  if(!F.tiles.length && !floorGen_()) return;
  var moved = floorMask_(), g = floorProg_(F.min);
  if(!F.shown){ floorDraw_(g); F.grew = false; return; }   // 初めて描く時は演出しない
  var grow = (animate || F.grew) && !floorSame_(F.shown, g);
  F.grew = false;
  if(moved){                                     // メニューの配置が変わった：薄める範囲を新しくして描き直す
    floorSettle_(); floorDraw_(grow ? F.shown : g);
  }else if(!grow){
    if(!floorSame_(F.shown, g)) floorDraw_(g);
    return;
  }
  if(grow) floorGrow_(F.shown, g);
}

/* 床の計算と描画は、メニューを描き終えた次の区切りに回す（初回は重いので、押せるまでの時間を遅らせない） */
function floorLater_(animate){
  if(FLOOR.pending) return;
  FLOOR.pending = true;
  requestAnimationFrame(function(){ setTimeout(function(){ FLOOR.pending = false; floorRender_(animate); }, 0); });
}
function floorOnShow(id){
  if(id !== 'start'){ floorSettle_(); return; }   // メニューを離れたら演出は打ち切って焼き付ける
  floorLater_(true);                              // 本番から戻った時は、増えた分がここで育つ
}
function floorSync(){ if(scr === 'start') floorLater_(false); }

var floorRT = 0;
window.addEventListener('resize', function(){
  clearTimeout(floorRT);
  floorRT = setTimeout(function(){
    if(!floorOn_()) return;
    floorSettle_(); FLOOR.tiles = []; FLOOR.shown = null; floorRender_(false);
  }, 200);
});

/* ============================================================
 *  画面
 * ============================================================ */
function show(id){
  ['start','keyset','popt','ptime','ptype','play','result'].forEach(function(s){ $(s).classList.remove('on'); });
  $(id).classList.add('on'); scr = id;
  floorOnShow(id);
}
function fatal(t){ $('msg').textContent = t; $('msg').classList.add('on'); }
/**
 * サーバーが混んでいて進めないとき。fatal と違って画面を塞がない。
 * 帯活動では40人が同じ数秒に集中するので、混雑は事故ではなく通常の状態。
 * 児童は最初の画面に戻って、もう一度押せばよい。
 */
function busy(t){
  var cd = $('countdown'); if(cd) cd.classList.remove('on');
  show('start');
  $('startHint').textContent = t;
}

/* 教師がクラスごとに公開したモードだけを出す。非公開のものは一覧に載せない */
function visibleModes(){
  return MODES_ALL.filter(function(m){ return !!CFG.open[m]; });
}
function isLocked(m){ return !!LOCKED[m]; }

/**
 * 公開されたモードが0件のときの箱。
 * 教師が公開すれば openWatch が拾って自動で出るので、児童は待てばよい。
 * 見張りを打ち切ったあと（WATCH_GAVEUP）だけ、再読み込みを頼む。
 */
function emptyBox(){
  return '<div class="empty">まだ もんだいが ひらいて いません。<br>' +
    (WATCH_GAVEUP ? 'がめんを さいど よみこんで ください。'
                  : 'せんせいが ひらくと じどうで でます。') + '</div>';
}

/* 上段＝番号とモード名だけ。副題は出さない（児童が選ぶのに要らず、名前の幅を奪う） */
function cardTop(m, idx){
  return '<div class="top"><div class="k">'+(idx+1)+'</div>'+
         '<div class="t">'+MODES[m].name+'</div></div>';
}

function renderMenu(){
  var vis = visibleModes();
  if(!vis.length){
    $('modeGrid').innerHTML = BOOTED ? emptyBox() : '';
    $('startHint').textContent = BOOTED ? '' : 'よみこみ中…';
    return;
  }
  $('modeGrid').innerHTML = vis.map(function(m, idx){
    if(isLocked(m)){
      return '<div class="card locked" data-mode="'+m+'">'+ cardTop(m, idx) +
        '<div class="bot"><div class="lock">'+LOCKED[m]+'</div></div></div>';
    }
    var hs = BEST[m];
    return '<div class="card" data-mode="'+m+'">'+ cardTop(m, idx) +
      '<div class="bot">'+
        '<div class="medal">'+(MEDAL[m]||'')+'</div>'+
        (STARS[m] ? '<div class="star">★'+STARS[m]+'</div>' : '')+
        '<div class="hsbox"><div class="hs'+(hs?'':' none')+'">'+(hs||'—')+'</div>'+
        '<div class="hslbl">'+CFG.limitSec+'びょう ベスト</div></div>'+
      '</div></div>';
  }).join('');
  // 押せる番号だけを案内する。順次開放で閉じているモードの番号を混ぜると、
  // 押しても始まらないキーを児童に教えることになる。
  // 1から連続して開いているうちは「1〜3」と範囲で言う（列挙より短い）
  var open = vis.map(function(m, i){ return isLocked(m) ? 0 : i+1; })
                .filter(function(n){ return n; });
  var seq = open.length && open[open.length-1] === open.length;
  $('startHint').textContent = !open.length ? ''
    : open.length === 1 ? (open[0] + ' のキーで はじまります')
    : seq ? ('1〜' + open.length + ' のキーで はじまります')
    : (open.join('・') + ' のキーで はじまります');
  floorSync();
}
function openPractice(){
  var vis = visibleModes();
  if(!vis.length){
    // 本番と同じ理由で空になる。ここだけ白い画面にすると、押した児童が戻り方に迷う
    $('poptGrid').innerHTML = emptyBox();
    show('popt');
    return;
  }
  $('poptGrid').innerHTML = vis.map(function(m, idx){
    return '<div class="card'+(isLocked(m)?' locked':'')+'" data-pmode="'+m+'">'+
      cardTop(m, idx) +
      (isLocked(m) ? '<div class="bot"><div class="lock">'+LOCKED[m]+'</div></div>' : '')+
      '</div>';
  }).join('');
  show('popt');
}

/* 練習も本番と同じ解禁条件で扱う。ここだけ開いていると順序が意味を失う */
function pickPractice(m){
  if(isLocked(m)) return;
  pMode = m; toTimeSelect();
}
function toTimeSelect(){ $('ptimeLimitLabel').textContent = CFG.limitSec + 'びょう'; show('ptime'); }

/**
 * 型を絞る画面。むせいげん（記録しない）を選んだときだけ出る。
 * 「この子は◯◯が弱い」という診断は画面に出さない。児童が自分で選ぶだけにする
 * （名指しは、遅さを隠す行動を誘発する。README の weak_child の項を参照）。
 */
function openTypeSelect(){
  var list = (TYPES_BY_MODE[pMode] || []).slice(0, 8);
  var cards = ['<div class="card" data-ptype=""><div class="k">1</div>' +
               '<div><div class="t">ぜんぶ</div><div class="s">いろいろ まざる</div></div></div>'];
  list.forEach(function(t, i){
    cards.push('<div class="card" data-ptype="'+t+'"><div class="k">'+(i+2)+'</div>' +
               '<div><div class="t">'+(TYPES[t] || t)+'</div></div></div>');
  });
  $('ptypeGrid').innerHTML = cards.join('');
  show('ptype');
}

/* ============================================================
 *  出題の描画（2欄対応）
 * ============================================================ */
/* まきじゃくを SVG で描く。目盛りは 1cm きざみ、10cm ごとに数字。
   描画は問題の切り替え時だけなので、入力の速さには影響しない。 */
/** 単元が宣言した設定を読む。無ければ既定値（＝従来の見た目）に落とす */
function uset_(k, dflt){
  var v = (CFG.settings || {})[k];
  return (v === undefined || v === null || v === '' || isNaN(v)) ? dflt : Number(v);
}

function rulerSVG(r){
  var W = 1180;
  var padL = 30, padR = 30;
  var innerW = W - padL - padR;
  var px = innerW / r.span;                 // 1cm あたりの px

  // 見た目は教師設定で変えられる。出題（r.span / r.at）は一切変えない。
  var tapeH = uset_('ruler_tape', 128);     // テープ本体（厚くして目盛りを読みやすく）
  var fs    = uset_('ruler_font', 44);      // 目盛りの数字
  var top   = 100 + uset_('ruler_offset', 0);
  // 上の緑矢印は top-76 まで、下の赤いm表示は top+tapeH+88 まで伸びる。
  // 位置を上げても切れないよう viewBox の上端を負にできるようにする。
  var minY = Math.min(0, top - 86);
  // 下の余白は 1m・2m の赤い表示のためのもの。窓の中にその表示が無ければ要らない。
  // 高さで詰まる画面（表示領域600px前後）では、余白のぶんだけ図が縮んで描かれるので、
  // 「めもり きほん」（0〜85cm＝1mの表示が出ない）は、これで横いっぱいに描ける。
  var hasM = Math.floor((r.from + r.span) / 100) * 100 >= Math.max(100, r.from);
  var H = (top + tapeH + (hasM ? 100 : 16)) - minY;
  var s = [];

  s.push('<rect x="'+padL+'" y="'+top+'" width="'+innerW+'" height="'+tapeH+'" rx="4" fill="#F3E4C4"/>');

  for(var c = 0; c <= r.span; c++){
    var v = r.from + c;
    var x = padL + c*px;
    var big = (v % 10 === 0), mid = (v % 5 === 0);
    // テープの太さを変えても目盛りがはみ出さないよう比率で持つ（既定128のときの56/37/22）
    var h = Math.round(tapeH * (big ? 0.4375 : (mid ? 0.289 : 0.172)));
    s.push('<line x1="'+x.toFixed(1)+'" y1="'+top+'" x2="'+x.toFixed(1)+'" y2="'+(top+h)+
           '" stroke="#5A4A2A" stroke-width="'+(big?4:2)+'"/>');
    if(big){
      var isM = (v % 100 === 0) && v > 0;
      var label = isM ? (v/100)+'m' : String(v % 100);
      // 端に来た数字は、中央ぞろえのままだと半分がテープの外へ出る
      // （左端は金具の下に隠れ、「0から測る」ことが読み取れない）。
      // はみ出す時だけ内側へ寄せる。実物の巻き尺も 0 は線の右に印刷されている。
      var w2 = fs * 0.6, anchor = 'middle', tx = x;
      if(x - w2 < padL){ anchor = 'start'; tx = x + 6; }
      else if(x + w2 > padL + innerW){ anchor = 'end'; tx = x - 6; }
      s.push('<text x="'+tx.toFixed(1)+'" y="'+(top+tapeH-Math.round(tapeH*0.14))+'" '+
             'text-anchor="'+anchor+'" '+
             'font-size="'+fs+'" font-weight="800" fill="'+(isM?'#C25A2A':'#5A4A2A')+'">'+label+'</text>');
    }
  }

  // 1m・2m の位置を、テープの下から赤い↑で示す
  for(var mv = 100; mv <= r.from + r.span; mv += 100){
    if(mv < r.from) continue;
    var mx = padL + (mv - r.from)*px;
    var by = top + tapeH;
    s.push('<path d="M '+mx.toFixed(1)+' '+(by+6)+' l -15 26 l 30 0 z" fill="#E5484D"/>');
    s.push('<line x1="'+mx.toFixed(1)+'" y1="'+(by+32)+'" x2="'+mx.toFixed(1)+'" y2="'+(by+50)+
           '" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/>');
    s.push('<text x="'+mx.toFixed(1)+'" y="'+(by+88)+'" text-anchor="middle" '+
           'font-size="'+Math.round(fs*0.95)+'" font-weight="800" fill="#E5484D">'+(mv/100)+'m</text>');
  }

  // 矢印（読み取る位置）と「？」。矢印だけだと「ここが何か」を言葉にしないまま
  // 数字を打つ児童が出る。？を添えて、問われているのがこの位置の長さだと明示する。
  var ax = padL + (r.at - r.from)*px;
  s.push('<path d="M '+ax.toFixed(1)+' '+(top-6)+' l -16 -28 l 32 0 z" style="fill:var(--acc)"/>');
  s.push('<line x1="'+ax.toFixed(1)+'" y1="'+(top-32)+'" x2="'+ax.toFixed(1)+'" y2="'+(top-76)+
         '" style="stroke:var(--acc)" stroke-width="6" stroke-linecap="round"/>');
  // 既定は矢印の右。右端に寄って窓からはみ出す時だけ左へ回す
  var qx = ax + 22, qAnchor = 'start';
  if(qx + fs*0.7 > padL + innerW){ qx = ax - 22; qAnchor = 'end'; }
  // 「？」は矢印（--acc）と分けて、問われている位置だと一目で分かる色にする
  s.push('<text x="'+qx.toFixed(1)+'" y="'+(top-14)+'" text-anchor="'+qAnchor+'" '+
         'font-size="'+Math.round(fs*1.15)+'" font-weight="800" style="fill:var(--q)">?</text>');

  // 左端の金具（0 から始まるときだけ）
  if(r.from === 0){
    s.push('<rect x="'+(padL-28)+'" y="'+(top-8)+'" width="30" height="'+(tapeH+16)+
           '" rx="5" fill="#3A4260"/>');
  }
  return '<svg viewBox="0 '+minY+' '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+s.join('')+'</svg>';
}

/**
 * まるい文字盤（はかり）を SVG で描く。単元が宣言した刻みだけを見る。
 *   dial = { max:一周ぶんの値, step:1目もりの値, label:数字を書く間隔, at:針の位置,
 *            unit:数字につける単位, big/bigUnit:大きい単位（任意） }
 * 「g」「kg」をここに書かないこと。まきじゃくが cm を決め打ちしているのと
 * 同じ誤りをもう一度作ることになる。単位名は宣言から受け取る。
 */
/* 拡大窓の一辺（SVG座標）。答えをはさむ2本の「数字つき目盛り」の根本が、どの針位置でも
   両方入る大きさにしてある（730g なら 700g と 800g の根本。数える起点と終点が窓の中で
   そろうので、右の文字盤を見に行かずに数えきれる）。
   窓の中心は針先ではなく、その2本の中点の方向に取る。針を中心にすると、針が一方の
   目盛りの真上に来たときにもう一方まで36度離れ、一辺265が要る（倍率1.3、目盛り間9px）。
   中点なら2本が左右対称に入るので177で足り、その分だけ大きく拡大できる。
   180 は必要量177に余白を足した値。全針位置（1kg側177通り・2kg側89通り）で、
   2本の根本・その数字・針先がすべて窓に収まることを確認してある。 */
var DIAL_ZOOM = 180;

/**
 * 全体表示と拡大窓は、まったく同じ図形を別の viewBox で見たもの。
 * 図形を1回だけ作って両方に渡すので、2つの間で目盛りがずれることが構造的に起きない。
 * 返り値 { full:全体（拡大枠つき）, zoom:拡大窓 }。
 */
function dialSVG(d){
  var W = 520, cx = 260, cy = 260, R = 222;
  var step  = Math.max(1, Number(d.step) || 1);
  var max   = Math.max(step, Number(d.max) || 1000);
  var label = Math.max(step, Number(d.label) || max);
  var at    = Number(d.at) || 0;
  var s = [], labs = [];

  s.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+16)+'" fill="#EDEFF5" stroke="#3A4260" stroke-width="8"/>');
  s.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+(R-2)+'" fill="#FBF7E8"/>');

  function ang(v){ return (v / max) * Math.PI * 2 - Math.PI / 2; }   // 0 は真上、時計回り
  function pt(v, rad){
    var th = ang(v);
    return [cx + rad * Math.cos(th), cy + rad * Math.sin(th)];
  }
  function fmt(v){
    if(v === 0) return '0';
    if(d.big && v % d.big === 0) return (v / d.big) + (d.bigUnit || '');
    return v + (d.unit || '');
  }

  // 目盛りは4階層。1目もり／5目もり／10目もり／20目もり（＝数字つき）。
  // 5目もりごとの区切りがあると、1つずつ数えなくても「5、10、13」と跳べる。
  // 色は足さない：文字盤に3色目が入ると針の独立性が落ちる。長さと太さだけで分ける。
  for(var v = 0; v < max; v += step){
    var isBig  = (v % label === 0);
    var isHalf = (v % (label / 2) === 0);
    var isFif  = (v % (step * 5) === 0);
    var len, w;
    if(isBig)       { len = 26; w = 4; }
    else if(isHalf) { len = 17; w = 2.5; }
    else if(isFif)  { len = 13; w = 2; }
    else            { len = 10; w = 1.6; }
    var a = pt(v, R), b = pt(v, R - len);
    s.push('<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+
           '" y2="'+b[1].toFixed(1)+'" stroke="#5A4A2A" stroke-width="'+w+'"/>');
    if(isBig){
      var tp = pt(v, R - 54);
      labs.push({ t: fmt(v), x: tp[0], y: tp[1] });
    }
  }

  /* 数字だけは全体表示と拡大窓で別に描く。
     目盛りと針は同じ図形をそのまま拡大するので位置は絶対にずれないが、数字は
     2倍で描くと窓を占領し、窓の縁にかかると「100g」が「00g」に切れて別の数に読める。
     box を渡すと、窓に入っている大目盛りの数字だけを、字が縁からはみ出さない位置に描く。
     どの針位置でも窓には大目盛りが必ず1つ以上入るので、数える起点は窓の中で完結する。 */
  function labels(fs, box){
    var out = [];
    for(var i = 0; i < labs.length; i++){
      var L = labs[i], x = L.x, y = L.y + fs * 0.37, anc = 'middle';
      if(box){
        if(L.x < box.x || L.x > box.x + box.s || L.y < box.y || L.y > box.y + box.s) continue;
        var w2 = L.t.length * fs * 0.34;
        if(x - w2 < box.x + 4){ x = box.x + 4; anc = 'start'; }
        else if(x + w2 > box.x + box.s - 4){ x = box.x + box.s - 4; anc = 'end'; }
        if(y - fs < box.y) y = box.y + fs;
        else if(y > box.y + box.s - 4) y = box.y + box.s - 4;
      }
      out.push('<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="'+anc+
               '" font-size="'+fs+'" font-weight="800" fill="#5A4A2A">'+L.t+'</text>');
    }
    return out.join('');
  }

  // 針は目盛りの根元(R-4)まで届かせる。以前は R-76 で止まっていて、児童は針の延長線を
  // 頭の中で引いてから目盛りを選んでいた。先端を点まで細めてあるので、目盛りに重なっても
  // 隠さない（実物の指針と同じ形）。根元を太くしてあるぶん、針自体は前より見つけやすい。
  var th = ang(at), dx = Math.cos(th), dy = Math.sin(th), nx = -dy, ny = dx;
  function P(along, side){
    return (cx + dx*along + nx*side).toFixed(1) + ',' + (cy + dy*along + ny*side).toFixed(1);
  }
  s.push('<polygon points="'+
         [P(R-4,0), P(40,5.5), P(14,7), P(-38,4), P(-38,-4), P(14,-7), P(40,-5.5)].join(' ')+
         '" fill="#E5484D"/>');
  s.push('<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="#3A4260"/>');

  /* 拡大する範囲。答えをはさむ数字つき目盛り v0・v1 の中点の方向に、半径 R-28 を
     中心として取る。半径方向では 104〜284 を写すので、数字（168）・目盛り（196〜222）・
     ふち（238）がすべて入り、目盛りの輪が窓のまん中あたりに来る。
     v1 が一周ぶん（max）に当たるときは真上の目盛りと同じ点になり、そこの数字は
     文字盤と同じく「0」のまま。数えるのは必ず下側の v0 からなので、これで足りる。 */
  var v0 = Math.floor(at / label) * label, v1 = v0 + label;
  var zc = pt((v0 + v1) / 2, R - 28), zh = DIAL_ZOOM / 2;
  var box = { x: zc[0] - zh, y: zc[1] - zh, s: DIAL_ZOOM };
  var shapes = s.join('');
  var ns = ' xmlns="http://www.w3.org/2000/svg"';

  return {
    full: '<svg viewBox="0 10 '+W+' 500"'+ns+'>'+ shapes + labels(30, null) +'</svg>',
    zoom: '<svg viewBox="'+box.x.toFixed(1)+' '+box.y.toFixed(1)+' '+DIAL_ZOOM+' '+DIAL_ZOOM+'"'+ns+'>'+
          shapes + labels(13, box) +'</svg>'
  };
}

/* 打った数字を、その欄の字形で描く。宣言が無い欄はそのまま返す */
function glyph_(unit, sv){
  var g = GLYPH[unit];
  if(!g || !sv) return sv || '';
  var out = '';
  for(var i=0;i<sv.length;i++){ var d = g[+sv[i]]; out += (d === undefined ? sv[i] : d); }
  return out;
}

/* 答えの欄ひとつ。既定の並べ方でも rows でも、欄はここだけで作る */
function slotSpan_(q, i){
  var unit = q.f[i];
  // 宣言は単元から来るが、そのまま style に入れるので形だけ確かめる
  var c = /^#[0-9A-Fa-f]{3,8}$/.test(SLOTCOLOR[unit] || '') ? SLOTCOLOR[unit] : '';
  return '<span class="slot'+(c ? ' accent' : '')+(i===fi ? ' cur' : '')+
         '" id="slot'+i+'" data-fi="'+i+'"'+(c ? ' style="--slotc:'+c+'"' : '')+'>'+
         (glyph_(unit, typed[unit]) || '&nbsp;')+'</span>';
}

/**
 * 打ち終えた答えの中身。欄の値を、画面に出ていたのと同じ字で並べる。
 *
 * 単位ラベル（「3あまり5」の「あまり」）を足すのは、既定の並べ方のときだけ。
 * rows を持つ問題では欄キーは画面に出ない名前で（'かける' 'つみ' 'しょう'）、
 * 足すと「9かける63」と読めない字が流れる。draw() の分岐と同じ規準。
 */
function ghostHtml_(q){
  return q.f.map(function(u){
    var v = glyph_(u, String(q.ans[u]));
    return '<span>'+v+'</span>' + (q.rows ? '' : unitSpan(u));
  }).join('');
}

/**
 * 答えの残像を1枚置く。次の問題の描画より前に呼ぶこと（欄がまだ画面にある）。
 *
 * **式の上に置く。** 欄のあった場所から立ち上げると、次の問題の1段目を
 * 通り抜けることになる（②なら「64まで」の行）。主指標は提示から初打鍵までで、
 * そこは次の問題を読んでいる最中なので、読む場所に大きな字を重ねてはいけない。
 * 式の箱の上の余白へ出せば、重ならずに、目を動かさずに見える。
 *
 * 横は欄の真ん中に合わせる（答えが左に来る単元でも、答えの真上に出る）。
 * 縦は bottom で留める。上へ伸びるので、残像自身の高さを測らなくてよい。
 * まきじゃく・はかりは図が画面いっぱいなので、上の余白が足りなければ
 * 画面の上端で止める（stage からはみ出させない）。
 *
 * 消すのは setTimeout。animationend は、動きを減らす設定で発火しない。
 */
function ghostAnswer_(q){
  var stage = eqEl.parentNode;
  var a = $('slot0'), b = $('slot'+(q.f.length-1));
  if(!stage || !a || !b) return;
  var sr = stage.getBoundingClientRect();
  var er = eqEl.getBoundingClientRect();
  var ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
  if(!sr.width || !er.height) return;

  if(ghostEl){ ghostEl.remove(); ghostEl = null; }
  clearTimeout(ghostTimer);

  var g = document.createElement('div');
  // 単位ラベルで切れない問題だけ、欄のあいだを空ける（ghostHtml_ と同じ規準）
  g.className = 'ghost' + (q.rows ? ' sp' : '');
  var fs = parseFloat(getComputedStyle(eqEl).fontSize) || 40;
  g.style.fontSize = fs + 'px';                        // 式と同じ大きさで抜ける
  g.style.left = (((ar.left + br.right) / 2) - sr.left) + 'px';
  // 式の上端より .12em 上に、残像の下端を置く。上端は stage の中に留める
  g.style.bottom = Math.min(sr.bottom - er.top + fs * 0.12,
                            sr.height - fs * 1.35) + 'px';
  g.innerHTML = ghostHtml_(q);
  stage.appendChild(g);
  ghostEl = g;
  ghostTimer = setTimeout(function(){
    if(ghostEl === g) ghostEl = null;
    g.remove();
  }, 460);
}

/**
 * 覆う段かどうか。
 * q.veil は「この番号以降の欄は、そこに着くまで見せない」という宣言で、
 * 段の中に入っている欄の番号で判定する。欄の無い段は覆わない。
 */
function rowVeiled_(q, ri){
  if(!q.rows || q.veil == null || fi >= q.veil) return false;
  var si = 0, hit = false;
  for(var r=0;r<q.rows.length;r++){
    for(var c=0;c<q.rows[r].length;c++){
      if(q.rows[r][c] !== SLOT) continue;
      if(r === ri && si >= q.veil) hit = true;
      si++;
    }
  }
  return hit;
}

/* 覆いの向こうの欄へは行かせない。タップでも矢印でも同じ */
function capField_(q, i){
  return (q.veil != null && fi < q.veil && i >= q.veil) ? q.veil - 1 : i;
}

function unitSpan(u){
  var c = UNITS[u];
  return '<span class="u"'+(c ? ' style="color:'+c+'"' : '')+'>'+u+'</span>';
}

function draw(){
  var q = queue[qi];

  var rhs = '';
  q.f.forEach(function(unit, i){ rhs += slotSpan_(q, i) + unitSpan(unit); });

  $('play').classList.toggle('ruler-mode', !!(q.ruler || q.dial));
  $('play').classList.toggle('dial-mode', !!q.dial);
  $('play').classList.toggle('fig-mode', !!q.fig);

  if(q.fig){
    /*
     * 単元が描いた図（SVG文字列）をそのまま置く。上に問い＋欄、下に図。
     * 共通画面は図の中身（円・箱・番号）を知らない。まきじゃく・文字盤と違って
     * 描画を単元側に持たせるのは、図の種類が単元ごとに違い、ここに足していくと
     * 共通画面が単元を知ることになるため。問いには「＝」を付けない（式ではない）。
     */
    var ask = q.q.map(function(tok){
      return UNITS.hasOwnProperty(tok) ? unitSpan(tok) : '<span>'+tok+'</span>';
    }).join('');
    eqEl.className = 'eq';
    eqEl.innerHTML =
      '<span class="line ans">'+ask+rhs+'</span>'+
      '<div class="figbox">'+q.fig+'</div>';
  }else if(q.dial){
    // はかりは、拡大窓（左）と文字盤（右）を並べ、式と正答数は上の帯へ。
    // 大きさは段の高さで決まる。dial_size は上限としてのみ効く。
    var fig = dialSVG(q.dial);
    var cap = Math.max(20, Math.min(70, uset_('dial_size', 64)));
    eqEl.className = 'eq';
    eqEl.innerHTML =
      '<span class="line ans">'+rhs+'</span>'+
      '<div class="dialrow" style="max-height:'+cap+'vh">'+
        '<div class="dialzoom">'+ fig.zoom +'</div>'+
        '<div class="dialfull">'+ fig.full +'</div>'+
      '</div>';
  }else if(q.ruler){
    // まきじゃくは図の下に答えの欄を置く。横幅(%)で大きさを決める
    eqEl.className = 'eq';
    eqEl.innerHTML =
      '<div class="rulerwrap">'+
        '<div class="ruler" style="width:'+
          Math.max(30, Math.min(100, uset_('ruler_width', 100)))+'%">'+ rulerSVG(q.ruler) +'</div>'+
        '<span class="line ans">'+rhs+'</span>'+
      '</div>';
  }else if(q.rows){
    /*
     * 問題が自分の並べ方を持つ場合。'_' の位置に答えの欄が入る。
     *
     * 既定の経路は「式 ＝ 欄」に固定されていて、欄は必ず右端にまとまる。
     * 「□＝4×8」のように答えが左に来る形も、
     * 「八 □ □ ／ 73−72＝□」のように段をまたいで欄が散る形も、そこでは作れない。
     * rows はその制約を外すためだけのもので、中身の意味は単元が持つ。
     */
    var si = 0;
    eqEl.className = 'eq';
    eqEl.innerHTML = q.rows.map(function(row, ri){
      var inner = row.map(function(tok){
        if(tok === SLOT) return slotSpan_(q, si++);
        if(UNITS.hasOwnProperty(tok)) return unitSpan(tok);
        if(OPS.hasOwnProperty(tok)) return '<span class="op">'+OPS[tok]+'</span>';
        return '<span>'+tok+'</span>';
      }).join('');
      return '<span class="line'+(rowVeiled_(q, ri) ? ' veiled' : '')+'" data-row="'+ri+'">'+
             inner+'</span>';
    }).join('');
  }else{
    var lhs = '';
    q.q.forEach(function(tok){
      if(UNITS.hasOwnProperty(tok)) lhs += unitSpan(tok);
      else if(OPS.hasOwnProperty(tok)) lhs += '<span class="op">'+OPS[tok]+'</span>';
      else lhs += '<span>'+tok+'</span>';
    });
    // 式が長いときは「＝」以下を2段目に落とす。
    var oneHtml = '<span class="line">'+lhs+'<span class="op">=</span>'+rhs+'</span>';
    var twoHtml = '<span class="line">'+lhs+'</span>'+
                  '<span class="line ans"><span class="op">=</span>'+rhs+'</span>';
    var two = (q.q.length > 4);
    eqEl.className = 'eq' + (two ? '' : ' oneline');
    eqEl.innerHTML = two ? twoHtml : oneHtml;

    // トークン数では幅を測れない。日本語の語（「一万の位の数字」）や、
    // 単位ラベル付きの2欄（「□あまり□」）があると、同じトークン数でも幅が倍ちがう。
    // .stage は鍵盤のぶん画面より狭いので、はみ出すと式の頭と答えの欄が画面の外へ出る。
    // 実際に描いてから幅を見て、収まらなければ2段に落とす。単元の内容には依存しない。
    var box = eqEl.parentNode;
    if(!two && box.clientWidth > 0 && eqEl.getBoundingClientRect().width > box.clientWidth){
      eqEl.className = 'eq';
      eqEl.innerHTML = twoHtml;
    }
  }

  shownAt = performance.now();
  firstKeyAt = 0;            // 初打鍵はまだ。最初の数字キーで一度だけ立てる
  curAns = [];
}

function paintSlots(){
  var q = queue[qi];
  q.f.forEach(function(unit, i){
    var el = $('slot'+i);
    if(!el) return;
    el.innerHTML = glyph_(unit, typed[unit]) || '&nbsp;';
    el.classList.toggle('cur', i===fi);
  });
  if(q.rows && q.veil != null){
    var rows = eqEl.querySelectorAll('.line[data-row]');
    for(var i=0;i<rows.length;i++){
      rows[i].classList.toggle('veiled', rowVeiled_(q, +rows[i].dataset.row));
    }
  }
}
function clearTyped(){
  typed = {}; fi = 0;
  var q = queue[qi];
  if(q) q.f.forEach(function(u){ typed[u] = ''; });
}
function bumpCount(){
  countEl.classList.remove('bump'); void countEl.offsetWidth;
  countEl.classList.add('bump');
}
function showMiss(){
  var ml = $('missline');
  ml.classList.remove('on'); void ml.offsetWidth; ml.classList.add('on');
  setTimeout(function(){ ml.classList.remove('on'); }, 260);
}

/* ============================================================
 *  判定
 * ============================================================ */
/**
 * 自動確定（Enterなし）に使う桁数の「宣言」を引く。
 * DIGITCAP = { 問題型 or モードid: { 欄キー: 桁数 } }。問題型を先に見る。
 *
 * 現在の問題の答え（q.ans）は一切参照しない — 参照すると、桁数の大小が
 * 「もうすぐ確定する／しない」という形でヒントに変わるため（docs/ARCHITECTURE.md 参照）。
 *
 * 問題型キーを許すのは、1つのモードに桁幅の違う型が同居するときにモードキーでは
 * 書けないため（例：「1200g=□kg□g」の g は下位で3桁、「1kg500g=□g」の g は合計で4桁。
 * どちらも欄キーは g）。型は問題文として画面に出ているので、型ごとに確定タイミングが
 * 違っても新たな情報漏れにはならない。漏れるとまずいのは答えの大きさであって型ではない。
 *
 * 宣言が無ければ null を返し、呼び出し側が単元非依存の既定値にフォールバックする。
 */
function digitCap_(m, t, unit){
  var byType = t && DIGITCAP[t];
  if(byType && byType[unit]) return byType[unit];
  var byMode = DIGITCAP[m];
  return (byMode && byMode[unit]) || null;
}

/* 空欄は 0 とみなす。400m を「0km400m」でも「km欄は空のまま400」でも正解にする */
function valOf(u){ return typed[u] === '' ? 0 : parseInt(typed[u], 10); }
function currentAns(){
  var q = queue[qi];
  return q.f.map(function(u){ return typed[u] === '' ? 0 : parseInt(typed[u],10); });
}
function isRight(){
  var q = queue[qi];
  var anyTyped = false;
  for(var i=0;i<q.f.length;i++) if(typed[q.f[i]] !== '') anyTyped = true;
  if(!anyTyped) return false;                       // 全部空は判定しない

  if(q.ruler || q.dial){
    // めもりは合計で見る。1m32cm も 132cm も、1kg500g も 1500g も正解にする。
    // 換算率は単元が SCALE で宣言したものを使う（ここに単位名を書かない）
    var got=0, want=0;
    q.f.forEach(function(u){
      var k = SCALE[u] || 1;
      got  += valOf(u) * k;
      want += q.ans[u] * k;
    });
    return got === want;
  }
  for(var i=0;i<q.f.length;i++){
    if(valOf(q.f[i]) !== q.ans[q.f[i]]) return false;
  }
  return true;
}
function pushItem(){
  items.push({
    i:  qi,
    a:  curAns.slice(),
    ms: Math.round(performance.now()-shownAt),          // 提示→送信（打鍵・欄移動を含む）
    tk: firstKeyAt ? Math.round(firstKeyAt-shownAt) : 0  // 提示→初打鍵（0＝取れなかった）
  });
  curAns = [];
}
function nextQuestion(){
  if(practice && !pRecorded){ pServe(); return; }   // 記録しない練習は1問ずつサーバーから
  qi++;                                             // 記録する練習は本番と同じ問題列を進む
  clearTyped(); draw();
}

function submit(){
  if(locked) return;
  var q = queue[qi];
  var anyTyped = false;
  for(var i=0;i<q.f.length;i++) if(typed[q.f[i]] !== '') anyTyped = true;
  if(!anyTyped) return;              // 何も打っていなければ何もしない

  attempts++;
  curAns.push(currentAns());

  if(isRight()){
    correct++; countEl.textContent = correct; bumpCount();
    // 次の問題を描く前に写す。draw() が eqEl を書き換えると欄が消える。
    // 残像は別の層なので、次の問題の描画は1msも遅れない
    // （遅らせると60秒あたりの問題数が減り、過去のベストと比べられなくなる）
    ghostAnswer_(q);
    if(!practice || pRecorded) pushItem();
    miss = 0;
    nextQuestion();
  }else{
    miss++; showMiss();
    locked = true;
    // 1回目のまちがいは「×」だけ出して、もう一度打たせる（自分で直す機会を残す）。
    // 2回目から正しい答えを赤で見せる。1回で次へ進む設定（missLimit=1）なら、進む前に見せる
    var reveal = miss >= 2 || miss >= CFG.missLimit;
    if(reveal){
      q.f.forEach(function(u){ typed[u] = String(q.ans[u]); });
      fi = q.f.length - 1;
      paintSlots();
      eqEl.classList.add('reveal');
      $('footnote').textContent = 'こたえは ' +
        q.f.map(function(u){ return glyph_(u, String(q.ans[u])) + u; }).join(' ');
    }
    setTimeout(function(){
      locked = false;
      setHelp();
      if(miss >= CFG.missLimit){
        if(!practice || pRecorded) pushItem();
        miss = 0; nextQuestion();
      }else{
        clearTyped(); draw();
        $('footnote').textContent = 'もう いちど';
      }
    }, reveal ? 1500 : 500);
  }
}

/* ============================================================
 *  入力（input要素を使わず keydown を直接拾う）
 * ============================================================ */
function moveField(d){
  var q = queue[qi];
  if(!q) return;
  var n = q.f.length;
  fi = Math.max(0, Math.min(n-1, capField_(q, fi + d)));
  paintSlots();
}
function setField(i){
  var q = queue[qi];
  if(!q || locked) return;
  i = capField_(q, i);
  if(i >= 0 && i < q.f.length){ fi = i; paintSlots(); }
}

function handleInput(k){
  if(locked || !ready) return;
  var q = queue[qi];
  if(!q) return;
  var unit = q.f[fi];
  var curMode = practice ? pMode : mode;        // beginPractice は mode を更新しないため

  if(k>='0' && k<='9'){
    // 提示から最初の数字キーまで＝想起（＋手続きの組み立て）にかかった時間。
    // 送信までの時間には打鍵と欄移動が乗るので、型ごとに答えの桁数が違うと
    // 型間の比較ができない。分離しておくのはそのため。
    if(!firstKeyAt) firstKeyAt = performance.now();
    if(typed[unit].length < 4){ typed[unit] += k; paintSlots(); }
    // 全欄が正解と一致したら即座に通す（空欄は0扱い）
    if(isRight()){ submit(); return; }

    var declared = digitCap_(curMode, q.t, unit);   // Unit が桁数を宣言していれば最優先
    if(fi < q.f.length - 1){
      // 前の欄 → 次の欄 への移動。正解と一致したら移る。
      // 一致しなくても、その欄の上限桁まで打てば移る。
      var lead = declared || ((q.ruler || q.dial) ? 1 : 2); // めもりの上位欄は1桁、他は最大2桁
      var right = parseInt(typed[unit],10) === q.ans[unit];
      // 覆いより手前の欄は、正解でないと次へ進めない。
      // 埋めただけで越えられると、誤った値のまま次の段が開き、
      // その段の式（前の段の答えを使って書いてある）と画面の中で食い違う。
      // 打ち切っても越えられないので、そこで1回のまちがいとして数える。
      if(q.veil != null && fi < q.veil && !right){
        if(typed[unit].length >= lead) submit();
        return;
      }
      if(right || typed[unit].length >= lead){
        fi++; paintSlots();
      }
    }else{
      // 最後の欄。
      // 宣言があれば宣言どおりの桁数で確定する（この問題の答えの桁数は見ない＝ヒント漏れなし）。
      // 宣言が無い単元は既存の既定動作のまま（正解の桁数 or 欄の上限で確定）。
      if(declared){
        if(typed[unit].length >= declared) submit();
      }else if(q.ruler || q.dial){
        var capR = (q.f.length === 1) ? 2 : 3;
        if(typed[unit].length >= capR) submit();
      }else{
        var need = String(q.ans[unit]).length;
        var cap = (q.f.length === 1) ? 4 : 3;
        if(typed[unit].length >= need || typed[unit].length >= cap) submit();
      }
    }
  }else if(k === 'Backspace'){
    if(typed[unit].length > 0){ typed[unit] = typed[unit].slice(0,-1); }
    else if(fi > 0){ fi--; typed[q.f[fi]] = typed[q.f[fi]].slice(0,-1); }
    paintSlots();
  }else if(k === 'Enter'){
    submit();
  }else if(k === 'ArrowRight' || k === 'Tab'){
    moveField(1);
  }else if(k === 'ArrowLeft'){
    moveField(-1);
  }
}

/* 画面キーのハイライト（背景色1回変更のみ＝軽い） */
var keyEls = {};
function indexKeys(){
  document.querySelectorAll('#pad .key').forEach(function(el){ keyEls[el.dataset.key] = el; });
}
function flashKey(k){
  var el = keyEls[k];
  if(!el) return;
  el.classList.add('down');
  setTimeout(function(){ el.classList.remove('down'); }, 160);
}

/* ---- 数字キーレイアウト ---- */
var LAYOUTS = ['tr','tl','row'];
var LAYOUT_LABEL = {tr:'テンキー（みぎきき）', tl:'テンキー（ひだりきき）', row:'よこ1れつ'};
var SIZES = ['l','m','s'];
var SIZE_LABEL = {l:'大', m:'中', s:'小'};
var SIZE_SCALE = {l:1, m:0.85, s:0.7};

function getLayout(){
  try{ var v = localStorage.getItem('km_layout'); if(LAYOUTS.indexOf(v)>=0) return v; }catch(e){}
  return 'tr';
}
function setLayout(v){ try{ localStorage.setItem('km_layout', v); }catch(e){} applyLayout(); updateKeysetNow(); }
function getSize(){
  try{ var v = localStorage.getItem('km_keysize'); if(SIZES.indexOf(v)>=0) return v; }catch(e){}
  return 'l';
}
function setSize(v){ try{ localStorage.setItem('km_keysize', v); }catch(e){} applyLayout(); updateKeysetNow(); }

/* めもりモードは巻き尺に横幅が要るので、テンキー設定でも横一列に切り替える。
   テンキーだと表示域が画面の2/3に狭まり、目盛りが読めなくなるため。 */
function needsWide(){
  var m = practice ? pMode : mode;
  return (m === 5 || m === 6);
}
function applyLayout(){
  var v = getLayout(), play = $('play');
  if(needsWide()) v = 'row';
  play.classList.remove('layout-tr','layout-tl');
  // 利き手そのものは残す。めもりモードは横一列に切り替わって layout-tl が外れるが、
  // 正答数をどちらの隅へ逃がすかは、キー配置ではなく利き手で決まる。
  play.classList.toggle('hand-left', getLayout() === 'tl');
  if(v==='tr') play.classList.add('layout-tr');
  if(v==='tl') play.classList.add('layout-tl');
  if(v==='row') layoutRow(); else layoutTenkey();
}
function layoutTenkey(){
  var pos = {'7':[0,0],'8':[1,0],'9':[2,0],'4':[0,1],'5':[1,1],'6':[2,1],
             '1':[0,2],'2':[1,2],'3':[2,2],'0':[0,3],'Backspace':[2,3]};
  var sc = SIZE_SCALE[getSize()];
  var gapX = 3.5*sc, gapY = 2.6*sc, kw = 30*sc, kh = 20*sc;
  var gridW = kw*3 + gapX*2, gridH = kh*4 + gapY*3;
  var left0 = (getLayout()==='tl') ? 2 : (98 - gridW);
  var top0 = 96 - gridH;
  Object.keys(keyEls).forEach(function(k){
    var el = keyEls[k], p = pos[k];
    el.style.left = (left0 + p[0]*(kw+gapX)) + '%';
    el.style.top = (top0 + p[1]*(kh+gapY)) + '%';
    el.style.width = (k==='0' ? (kw*2+gapX) : kw) + '%';
    el.style.height = kh + '%';
    el.style.bottom = 'auto';
  });
}
function layoutRow(){
  Object.keys(keyEls).forEach(function(k){
    var el = keyEls[k];
    el.style.left=''; el.style.top=''; el.style.bottom=''; el.style.width=''; el.style.height='';
  });
}
function renderKeyset(){
  var cur = getLayout();
  $('keysetGrid').innerHTML = LAYOUTS.map(function(v, i){
    var on = v===cur;
    return '<div class="card" data-layout="'+v+'" style="'+(on?'border-color:var(--acc);':'')+'">'+
      '<div class="k">'+(i+1)+'</div><div><div class="t">'+LAYOUT_LABEL[v]+'</div>'+
      (on?'<div class="s" style="color:var(--acc)">いま これ</div>':'')+'</div></div>';
  }).join('');
  var wrap = $('keysetSize');
  if(cur === 'row'){ wrap.style.display='none'; return; }
  wrap.style.display = '';
  var cs = getSize();
  $('keysetSizeGrid').innerHTML = SIZES.map(function(v, i){
    var on = v===cs;
    return '<div class="szbtn" data-size="'+v+'" style="'+(on?'border-color:var(--acc);color:var(--acc)':'')+'">'+
      '<span class="k2">'+(i+4)+'</span>'+SIZE_LABEL[v]+'</div>';
  }).join('');
}
function openKeyset(){ renderKeyset(); show('keyset'); }
function updateKeysetNow(){
  var el = $('keysetNow'); if(!el) return;
  el.textContent = LAYOUT_LABEL[getLayout()] + (getLayout()==='row' ? '' : ' / '+SIZE_LABEL[getSize()]);
}

/* ============================================================
 *  タイマー
 * ============================================================ */
function tick(){
  var left = CFG.limitSec*1000 - (performance.now()-startT);
  if(left <= 0){ practice ? finishPractice() : finish(); return; }
  var p = left / (CFG.limitSec*1000);
  barEl.style.transform = 'scaleX('+p+')';
  if(p < 0.17) barEl.classList.add('low');
  raf = requestAnimationFrame(tick);
}

/* ============================================================
 *  開始・終了
 * ============================================================ */
/** 練習が記録の対象か。時間制限あり かつ ランダム出題のときだけ */
function practiceRecorded(timed){
  return !!timed;
}

/* 記録しない練習（むせいげん）の出題。サーバーから1問ずつ受け取る。
   1問だけ先読みしておくので、2問目以降は待ち時間が出ない。 */
var pBuf = null, pFetching = false, pFail = 0, pWaitTimer = 0;

function pFetch(){
  if(pFetching || pBuf || !SRV) return;
  pFetching = true;
  google.script.run.withSuccessHandler(function(r){
    pFetching = false;
    if(r && r.ok){
      pFail = 0;
      var a = {};
      r.f.forEach(function(u, i){ a[u] = r.ans[i]; });
      pBuf = {q:r.q, f:r.f, ans:a, ruler:r.ruler||null, t:r.t||null, dial:r.dial||null,
              rows:r.rows||null, veil:(r.veil == null ? null : r.veil), fig:r.fig||null};
    }else{ pFail++; }
  }).withFailureHandler(function(){ pFetching = false; pFail++; })
    .nextPracticeItem(pMode, pType);
}

/** 先読みが間に合っていればすぐ描く。間に合わなければ届き次第 描く */
function pServe(){
  clearTimeout(pWaitTimer);
  if(!SRV){ queue = [previewItem()]; qi = 0; ready = true; clearTyped(); draw(); return; }
  if(pFail >= 3){ fatal('つうしんに しっぱいしました。ページを ひらきなおして ください。'); return; }
  if(pBuf){
    queue = [pBuf]; qi = 0; pBuf = null;
    ready = true; clearTyped(); draw();
    pFetch();                                  // 次の1問を仕込んでおく
    return;
  }
  ready = false;                               // 到着まで入力を受けない
  eqEl.className = 'eq oneline';
  eqEl.innerHTML = '<span class="line">…</span>';
  pFetch();
  pWaitTimer = setTimeout(pServe, 120);
}

function beginPractice(timed){
  practice = true; pTimed = !!timed;
  // 記録する経路では型を絞らない。同じ型ばかりの記録が入ると
  // weak_child の平均がその型だけ短く出て、診断が壊れる
  if(timed) pType = '';
  pRecorded = practiceRecorded(timed);
  correct=0; attempts=0; miss=0; locked=false; items=[]; curAns=[]; token='';
  ready = !pRecorded;                       // 記録するときは問題列の到着を待つ
  startAborted = false;
  countEl.textContent='0';
  $('playMedal').textContent='';
  $('playLabel').textContent = MODES[pMode].name +
    (pTimed ? (pRecorded ? '（きろく あり）' : '')
            : ' ／ むせいげん' + (pType ? '（' + (TYPES[pType] || pType) + '）' : ''));
  $('footnote').textContent='';
  applyLayout();

  if(pRecorded && SRV){
    // 本番と同じ経路を通す。点数を自己申告させないため
    google.script.run.withSuccessHandler(function(r){
      if(!r.ok){ fatal(r.msg); return; }
      token = r.token;
      CFG.limitSec = r.limitSec; CFG.missLimit = r.missLimit;
      queue = r.qs.map(function(x){
        var a = {};
        x[1].forEach(function(u, i){ a[u] = x[2][i]; });
        return {q:x[0], f:x[1], ans:a, ruler:x[3]||null, t:x[4]||null, dial:x[5]||null,
                rows:x[6]||null, veil:(x[7] == null ? null : x[7]), fig:x[8]||null};
      });
      qi = 0; clearTyped(); ready = true;
    }).withFailureHandler(function(){
      startAborted = true;
      busy('サーバーが こんでいます。すこし まってから もういちど おしてね');
    }).startSession(pMode, true);
  }else{
    pBuf = null; pFail = 0; ready = false; clearTyped();
  }

  show('play');
  setHelp();
  if(pTimed){
    barEl.classList.remove('hidden','low');
    barEl.style.transform='scaleX(1)';
    eqEl.innerHTML='';
    countdown(3);
  }else{
    barEl.classList.add('hidden');
    pServe();                                  // 1問目の到着を待って描く
  }
}

function finishPractice(){
  cancelAnimationFrame(raf);
  if(curAns.length > 0 && pRecorded) pushItem();

  $('finalScore').textContent = correct;
  $('rank').textContent = '';

  if(!pRecorded){
    $('acc').textContent=''; $('best').textContent='';
    $('saving').textContent = 'れんしゅう：きろくしません';
    document.body.classList.add('practice-result');
    show('result');
    return;
  }

  // 記録する練習：本番と同じ送信経路。ランキングには入らない
  var m = pMode, sent = { token: token, items: items.slice(), mode: m, practice: true };
  $('acc').textContent = attempts ? Math.round(correct/attempts*100)+'%' : '0%';
  $('best').textContent = Math.max(PBEST[m]||0, correct);
  $('bestLbl').textContent = 'れんしゅう ベスト';
  document.body.classList.remove('practice-result');
  show('result');

  if(!SRV || !sent.token || !sent.items.length){ $('saving').textContent=''; return; }
  $('saving').textContent = 'きろく中…';
  pendSave(sent);
  google.script.run.withSuccessHandler(function(r){
    if(r.ok){
      pendClear();
      PBEST[r.mode] = r.best;
      renderMenu();
      if(scr === 'result') $('best').textContent = r.best;
      $('saving').textContent = r.updated ? 'じこベスト こうしん！' : '';
    }else{
      if(r.code==='gone'||r.code==='bad') pendClear();
      $('saving').textContent = r.msg || '';
    }
  }).withFailureHandler(function(){
    $('saving').textContent = 'あとで ほぞんします';
  }).submitSession(sent.token, sent.items);
}

function begin(m){
  if(!CFG.open[m] || isLocked(m)) return;
  practice=false; pTimed=false; pRecorded=false;
  document.body.classList.remove('practice-result');
  mode=m; token=''; ready=false; startAborted=false;
  barEl.classList.remove('hidden');
  $('playLabel').textContent = MODES[m].name;
  $('footnote').textContent='';

  if(SRV){
    google.script.run.withSuccessHandler(function(r){
      if(!r.ok){ fatal(r.msg); return; }
      token = r.token;
      CFG.limitSec = r.limitSec; CFG.missLimit = r.missLimit;
      queue = r.qs.map(function(x){
        var a = {};
        x[1].forEach(function(u, i){ a[u] = x[2][i]; });
        return {q:x[0], f:x[1], ans:a, ruler:x[3]||null, t:x[4]||null, dial:x[5]||null,
                rows:x[6]||null, veil:(x[7] == null ? null : x[7]), fig:x[8]||null};
      });
      ready = true; clearTyped();
    }).withFailureHandler(function(){
      startAborted = true;
      busy('サーバーが こんでいます。すこし まってから もういちど おしてね');
    }).startSession(m);
  }else{
    queue = []; for(var i=0;i<200;i++) queue.push(previewItem());
    token=''; ready=true; clearTyped();
  }

  qi=0; correct=0; attempts=0; miss=0; locked=false; items=[]; curAns=[];
  countEl.textContent='0';
  $('playMedal').textContent = MEDAL[m] || '';
  barEl.classList.remove('low'); barEl.style.transform='scaleX(1)';
  eqEl.innerHTML='';
  applyLayout();
  show('play');
  setHelp();
  countdown(3);
}
/* 桁数が揃わず自動確定できないモードは、Unit.gs が help に案内文を持つ */
function setHelp(){
  var m = practice ? pMode : mode;
  $('footnote').textContent = (MODES[m] && MODES[m].help) || '';
}
function countdown(n){
  var el = $('countdown');
  // 開始が失敗していれば、残っている「3・2・1」の連鎖もここで畳む。
  // 畳まないと、最初の画面に戻したあとに数字だけが浮かぶ
  if(startAborted){ el.classList.remove('on'); return; }
  el.classList.add('on'); el.textContent = n;
  if(n > 1){ setTimeout(function(){ countdown(n-1); }, 700); return; }
  // 問題列の到着を待つ上限。これが無いと、サーバーが詰まったとき
  // カウントダウンの「1」を出したまま永久に止まる（何も知らせないまま）
  var until = Date.now() + 15000;
  var go = function(){
    if(startAborted){ el.classList.remove('on'); return; }
    if(!ready){
      if(Date.now() > until){
        el.classList.remove('on');
        busy('サーバーが こんでいます。すこし まってから もういちど おしてね');
        return;
      }
      setTimeout(go, 120); return;
    }
    el.classList.remove('on');
    clearTyped(); draw();
    startT = performance.now();
    raf = requestAnimationFrame(tick);
  };
  setTimeout(go, 700);
}

function finish(){
  cancelAnimationFrame(raf);
  if(curAns.length > 0) pushItem();
  var m = mode;
  var sent = { token: token, items: items.slice(), mode: m };

  $('finalScore').textContent = correct;
  $('acc').textContent = attempts ? Math.round(correct/attempts*100)+'%' : '0%';
  $('best').textContent = Math.max(BEST[m], correct);
  $('rank').textContent = '';
  show('result');

  if(!SRV){
    $('saving').textContent = '（ローカル表示：記録されません）';
    floorAdd(m, correct);            // プレビューでは記録の代わりにその場で育てて、動きを確かめられるようにする
    return;
  }
  if(!sent.token || !sent.items.length){
    $('saving').textContent = CFG.guest ? 'おためしモード：きろくされません' : '';
    return;
  }
  $('saving').textContent = 'きろく中…';
  pendSave(sent);
  google.script.run.withSuccessHandler(function(r){
    if(r.ok){
      pendClear();
      BEST[r.mode]=r.best; MEDAL[r.mode]=r.medal;
      if(r.star) STARS[r.mode] = r.star;
      floorAdd(r.mode, r.score);     // 記録できた本番の正答だけ床が育つ
      renderMenu();
      if(mode===r.mode && scr==='result'){
        $('best').textContent = r.best;
        $('rank').textContent = r.medal;
        $('playMedal').textContent = r.medal;
        var bl=$('bestLbl'); if(bl) bl.textContent = r.limitSec + 'びょう ベスト';
      }
      $('saving').textContent = r.updated ? 'じこベスト こうしん！ ★'+r.star : '';
    }else{
      if(r.code==='gone'||r.code==='bad') pendClear();
      $('saving').textContent = r.msg || '';
    }
  }).withFailureHandler(function(){
    $('saving').textContent = 'あとで ほぞんします';
  }).submitSession(sent.token, sent.items);
}

/* ============================================================
 *  もどる
 * ============================================================ */
function goBack(){
  if(scr === 'keyset') show('start');
  else if(scr === 'popt') show('start');
  else if(scr === 'ptime') show('popt');
  else if(scr === 'ptype') show('ptime');
  else if(scr === 'result'){
    document.body.classList.remove('practice-result');
    show(practice ? (pTimed ? 'ptime' : 'ptype') : 'start');
  }else if(scr === 'play'){
    cancelAnimationFrame(raf);
    show(practice ? (pTimed ? 'ptime' : 'ptype') : 'start');
  }
}

/* ============================================================
 *  キー入力
 * ============================================================ */
document.addEventListener('keydown', function(e){
  var k = e.key;

  if(scr === 'start'){
    if(k>='1' && k<='6'){
      e.preventDefault();
      var vis = visibleModes();
      if(+k <= vis.length) begin(vis[+k-1]);
    }else if(k === '0'){ e.preventDefault(); openPractice(); }
    else if(k === '9'){ e.preventDefault(); openKeyset(); }
    return;
  }
  if(scr === 'keyset'){
    if(k>='1' && k<='3'){ e.preventDefault(); setLayout(LAYOUTS[+k-1]); renderKeyset(); }
    else if(k>='4' && k<='6'){ e.preventDefault(); setSize(SIZES[+k-4]); renderKeyset(); }
    else if(k === 'Escape'){ e.preventDefault(); goBack(); }
    return;
  }
  if(scr === 'popt'){
    if(k>='1' && k<='6'){
      e.preventDefault();
      var v2 = visibleModes();
      if(+k <= v2.length) pickPractice(v2[+k-1]);
    }else if(k === 'Escape'){ e.preventDefault(); goBack(); }
    return;
  }
  if(scr === 'ptime'){
    if(k === '1'){ e.preventDefault(); beginPractice(true); }
    else if(k === '2'){ e.preventDefault(); openTypeSelect(); }
    else if(k === 'Escape'){ e.preventDefault(); goBack(); }
    return;
  }
  if(scr === 'ptype'){
    if(k>='1' && k<='9'){
      e.preventDefault();
      var tl = (TYPES_BY_MODE[pMode] || []).slice(0, 8);
      if(+k === 1){ pType = ''; beginPractice(false); }
      else if(+k - 2 < tl.length){ pType = tl[+k-2]; beginPractice(false); }
    }else if(k === 'Escape'){ e.preventDefault(); goBack(); }
    return;
  }
  if(scr === 'result'){
    if(k === 'Enter'){
      e.preventDefault();
      document.body.classList.remove('practice-result');
      practice ? beginPractice(pTimed) : begin(mode);
    }else if(k === 'Escape'){ e.preventDefault(); goBack(); }
    return;
  }
  if(scr === 'play'){
    if(k === 'Escape'){ goBack(); return; }
    if(locked || !ready) return;
    if((k>='0' && k<='9') || k==='Backspace' || k==='Enter'){
      e.preventDefault();
      flashKey(k);
      handleInput(k);
    }
  }
}, {passive:false});

/* ============================================================
 *  クリック
 * ============================================================ */
document.addEventListener('click', function(e){
  var t = e.target;
  if(t.closest('[data-back]')){ goBack(); return; }
  if(t.closest('[data-act="again"]') && scr === 'result'){
    document.body.classList.remove('practice-result');
    practice ? beginPractice(pTimed) : begin(mode);
    return;
  }

  if(scr === 'start'){
    if(t.closest('#toPractice')){ openPractice(); return; }
    if(t.closest('#toKeyset')){ openKeyset(); return; }
    var c = t.closest('.card');
    if(c && c.dataset.mode) begin(+c.dataset.mode);
  }else if(scr === 'keyset'){
    var lc = t.closest('[data-layout]');
    if(lc){ setLayout(lc.dataset.layout); renderKeyset(); return; }
    var sz = t.closest('[data-size]');
    if(sz){ setSize(sz.dataset.size); renderKeyset(); }
  }else if(scr === 'popt'){
    var pc = t.closest('[data-pmode]');
    if(pc) pickPractice(+pc.dataset.pmode);
  }else if(scr === 'ptime'){
    var tc = t.closest('.timecard');
    if(tc){
      if(tc.dataset.time === 'limit') beginPractice(true);
      else openTypeSelect();                    // むせいげんのときだけ型を選ばせる
    }
  }else if(scr === 'ptype'){
    var yc = t.closest('[data-ptype]');
    if(yc){ pType = yc.dataset.ptype || ''; beginPractice(false); }
  }else if(scr === 'play'){
    var slot = t.closest('.slot');
    if(slot){ setField(+slot.dataset.fi); return; }   // 解答欄をタップして移動
    var key = t.closest('.key');
    if(key){ flashKey(key.dataset.key); handleInput(key.dataset.key); }
  }
}, false);

/* ============================================================
 *  起動
 * ============================================================ */
indexKeys();
applyLayout();
updateKeysetNow();

/** タイトルは id ではなく class="apptitle"。要素が無くても落とさない */
function setAppTitle(t){
  var el = document.querySelector('.apptitle');
  if(el) el.textContent = t;
}

/**
 * boot() の結果を画面に反映する。
 * サーバーからの応答でも、localStorage の前回分でも、同じ経路を通す。
 */
function applyBoot(r, live){
  CFG.limitSec=r.limitSec; CFG.missLimit=r.missLimit;
  CFG.open = r.open || {}; CFG.guest = !!r.guest;
  CFG.settings = r.settings || {};
  LOCKED = r.locked || {};             // 古い控えには無いので {}（＝全部開いて見える）に落とす
  MODES = {}; MODES_ALL = [];
  (r.unit.modes||[]).forEach(function(m){ MODES[m.id]=m; MODES_ALL.push(m.id); });
  UNITS = r.unit.units || {};
  DIGITCAP = r.unit.digitCap || {};    // 古い localStorage の控えには無いので {} に落とす
  SCALE = r.unit.scale || {};
  GLYPH = r.unit.glyph || {};          // 古い localStorage の控えには無いので {} に落とす
  SLOTCOLOR = r.unit.slotColor || {};
  setPalette_(r.unit.accent, r.unit.alert, r.unit.q);   // 古い控えには無いので既定（3年）のまま
  // 背景の床。標準の分数・モードごとの1分あたり平均正答・第二の色。
  // 古い控え・古いエンジンには無いので 0・既定・既定色に落とす
  FLOOR.min = Number((r.floor || {}).min) || 0;
  FLOOR.pace = (r.floor || {}).pace || {};
  FLOOR.c2 = r.unit.floor2 || '';
  FLOOR.pat = r.unit.floorPattern || '';   // 図形。古い控え・古いエンジンには無いのでペンローズに落とす
  TYPES = r.unit.types || {};
  TYPES_BY_MODE = r.unit.typesByMode || {};
  setAppTitle(r.unit.title);
  BEST=r.best; MEDAL=r.medals;
  // 控えを描いただけでは「開いていない」と断定できない。
  // 断定してよいのはサーバーが答えた時だけ（live）
  if(live) BOOTED = true;
  STARS = r.stars || {}; PBEST = r.practiceBest || {};
  var tl = $('teacherLink');
  if(tl){
    // 教師のアカウントで児童画面を開いた時だけ、教師画面への導線を出す。
    // 判定はサーバー（isTeacher_）。児童には teacherUrl 自体が渡らない
    if(r.teacher && r.teacherUrl){
      tl.innerHTML = '<a href="' + r.teacherUrl + '">せんせい用の ページ →</a>';
      tl.style.display = '';
    }else{
      tl.style.display = 'none';
    }
  }
  if(r.keyGap >= 0) $('pad').style.gap = Math.min(Number(r.keyGap)||8, 40) + 'px';
  $('timelede').textContent = '1回 ' + r.limitSec + 'びょう';
  var bl0=$('bestLbl'); if(bl0) bl0.textContent = r.limitSec + 'びょう ベスト';
  renderMenu();
  // エンジンと画面の版がちがうと、新しい機能が呼べず黙って止まる。
  // localStorage の古い控え（r.ver 無し）では判定しない。確かなのは live の応答だけ
  if(live && r.ver !== undefined && r.ver !== WANT_VER){
    $('startHint').textContent = 'アプリの版が古いようです。先生に つたえてください';
  }
}

/**
 * 前回の boot() 結果を控えておき、次回の起動で「先に」描く。
 *
 * GAS はサンドボックスの起動と1往復（300〜800ms）が終わるまで応答が来ない。
 * 以前はその間 show() が呼ばれず、児童は真っ白な画面を見ていた。
 * 控えを先に描けばメニューは往復ゼロで出る。到着後に applyBoot で上書きする。
 *
 * 古い控えでモードが多く見えても、startSession 側が modeAllowed_ で
 * 弾くので不正には通らない（表示だけが最大1往復ぶん古い）。
 * デプロイURLごとに分けて持つ（九九と長さで混ざらないように）。
 */
/* ============================================================
 *  公開待ちの見張り
 *
 *  boot() は起動時の1回だけ。教師が授業中にモードを公開しても、
 *  画面を開いたままの端末は再読み込みするまで空のまま残る。
 *  帯活動の最中に40人へ「もう一回ひらいて」と言わせないために、
 *  「公開が0件のときだけ」取り直す。1件でも開けば止まる。
 *
 *  既に開いている児童は1回も余計に叩かない（通常は通信が増えない）。
 *  待っている端末だけが対象なので、負荷は「まだ開いていない人数」で頭打ちになり、
 *  教師が公開した瞬間に0へ戻る。
 * ============================================================ */
var WATCH_EVERY = 15000;     // 間隔(ms)。教室で「押したらすぐ出る」と感じる範囲の上限
var WATCH_MAX   = 40;        // 打ち切りまでの回数。15秒×40＝約10分
var WATCH_LEFT  = WATCH_MAX, WATCH_GAVEUP = false, watchTimer = 0;

function watchNext(ms){
  if(watchTimer) clearTimeout(watchTimer);
  // 端末ごとに散らす。40台が同じ授業の頭に開くと、揃った秒に一斉に叩くことになる
  watchTimer = setTimeout(watchRun, ms + Math.floor(Math.random() * 5000));
}
function watchRun(){
  watchTimer = 0;
  if(!SRV || visibleModes().length) return;                 // 開いた＝見張り終了
  if(scr !== 'start' && scr !== 'popt'){ watchNext(WATCH_EVERY); return; }
  if(document.hidden){ watchNext(WATCH_EVERY); return; }     // ふたを閉じた端末は数えない
  if(WATCH_LEFT <= 0){ WATCH_GAVEUP = true; renderMenu(); return; }
  WATCH_LEFT--;
  google.script.run.withSuccessHandler(function(r){
    if(r && r.ok){
      applyBoot(r, true); bootCacheSave(r);
      if(visibleModes().length){
        if(scr === 'popt') openPractice();                   // 練習の選択画面も描き直す
        return;
      }
    }
    watchNext(WATCH_EVERY);
  }).withFailureHandler(function(){ watchNext(WATCH_EVERY); }).boot();
}
/* ふたを開け直した・タブに戻ってきた時は、次の15秒を待たずに見に行く。
   打ち切っていても、戻ってきた操作を「まだ待つ」の合図として数え直す */
document.addEventListener('visibilitychange', function(){
  if(document.hidden || !SRV) return;
  if(!BOOTED){                       // 起動そのものが通っていない。数え直して取り直す
    if(bootTry > 0){ bootTry = 0; bootFetch(); }
    return;
  }
  if(visibleModes().length) return;
  WATCH_LEFT = WATCH_MAX; WATCH_GAVEUP = false;
  renderMenu();
  watchNext(1000);
});

/**
 * 起動の取得。失敗しても黙らない。
 *
 * 以前は「控えがあれば何もしない」だった。控えがある端末では失敗が画面に出ず、
 * 案内は『よみこみ中…』のまま残る。帯活動で40人が同時に開くと、
 * サーバー側の同時実行の枠を超えた児童はこの状態のまま置き去りになり、
 * 教師には「読み込み中で止まった」としか見えない。
 *
 * 混雑は事故ではなく通常の状態なので、間を空けて自分で取り直す。
 * 間隔は 2,4,8,16,30,30… 秒（＋ばらつき）。40台が揃って再挑戦すると
 * 混雑をそのまま再現するので、ここでも秒をずらす。
 */
var bootTry = 0;
function bootFetch(){
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){ fatal(r.msg); return; }
    bootTry = 0;
    applyBoot(r, true);
    bootCacheSave(r);
    // ここで show('start') を呼ばない。控えからメニューを先に描いているので、
    // 児童は往復の前にもう始められる。応答が届いた時に画面を戻すと、
    // 始めた直後の児童をカウントダウンごと最初の画面へ引きはがすことになる。
    setTimeout(pendFlush, Math.floor(Math.random() * 8000));   // 未送信の再送も散らす
    if(!visibleModes().length) watchNext(WATCH_EVERY);         // 公開0件のときだけ見張る
  }).withFailureHandler(function(){
    bootTry++;
    // 遊べる控えがあるなら黙って取り直す。案内文を混雑の知らせで潰さない
    if(!visibleModes().length){
      $('startHint').textContent = (bootTry >= 8)
        ? 'サーバーが こんでいます。ページを ひらきなおして ください。'
        : 'サーバーが こんでいます。まっててね…';
    }
    if(bootTry >= 8) return;
    setTimeout(bootFetch, Math.min(2000 * Math.pow(2, bootTry - 1), 30000)
                          + Math.floor(Math.random() * 3000));
  }).boot();
}

var BOOT_KEY = 'km_boot_' + APP_ID + '_' + (location.pathname || '');
function bootCacheSave(r){
  try{ localStorage.setItem(BOOT_KEY, JSON.stringify(r)); }catch(e){}
}
function bootCacheLoad(){
  try{
    var r = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null');
    // 別の単元の控えは使わない（キーを分けたうえで、念のため中身の単元も確かめる）
    return (r && r.ok && r.unit && r.unit.modes && r.unit.id === APP_ID) ? r : null;
  }catch(e){ return null; }
}

if(SRV){
  var cached = bootCacheLoad();
  if(cached){
    applyBoot(cached);
    show('start');                 // 往復を待たずにメニューを出す
  }else{
    setAppTitle('よみこみ中…');   // 初回だけ。空白を見せない
    renderMenu();
    show('start');
  }

  bootFetch();
}else{
  BEST={1:18,2:12,3:9,4:0}; MEDAL={1:'🥈',2:'',3:'',4:''};
  STARS={1:7,2:3,3:1,4:0}; PBEST={1:15,2:0,3:0,4:0};
  renderMenu(); show('start');
}
</script>
</body>
