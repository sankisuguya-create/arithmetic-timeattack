<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--paper:#F7F7F4;--ink:#101728;--mute:#9AA0B0;--line:#DFDFD8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans",sans-serif;
  -webkit-font-smoothing:antialiased;padding:2.2rem 1.4rem 3rem;
  display:flex;flex-direction:column;align-items:center;gap:1.8rem}
.apptitle{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;letter-spacing:.02em;text-align:center}
.who{font-size:.95rem;color:var(--mute);font-weight:700;margin-top:-1.2rem}

.grid{display:grid;gap:1rem;width:min(880px,100%);
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tile{display:flex;flex-direction:column;justify-content:center;gap:.35rem;
  min-height:clamp(120px,18vw,168px);padding:1.4rem 1.5rem;border-radius:20px;
  text-decoration:none;border:none;cursor:pointer;
  transition:transform .1s ease-out,filter .1s;
  box-shadow:0 3px 0 rgba(0,0,0,.14)}
.tile:hover{filter:brightness(1.05)}
.tile:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.14)}
.tile .t{font-size:clamp(1.25rem,3.2vw,1.7rem);font-weight:800;line-height:1.2}
.tile .s{font-size:.88rem;font-weight:700;opacity:.72}

.empty{color:var(--mute);font-weight:700;text-align:center;line-height:2;padding:3rem 1rem}
#msg{display:none;padding:3rem 1rem;text-align:center;font-weight:700;line-height:1.9}
#msg.on{display:block}
.foot{font-size:.78rem;color:var(--mute);font-weight:600;margin-top:.6rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="apptitle" id="title">算数タイムアタック</div>
<div class="who" id="who"></div>
<div class="grid" id="grid"></div>
<div id="msg"></div>
<div class="foot" id="foot"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var COLORS = {};

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function render(r){
  COLORS = r.colors || {};
  $('title').textContent = r.title || '算数タイムアタック';
  $('who').textContent = r.grade ? (r.grade + 'ねんせい') : '';

  if(!r.links.length){
    $('grid').innerHTML =
      '<div class="empty">いま つかえる れんしゅうは ありません。<br>先生に きいてください。</div>';
    return;
  }
  $('grid').innerHTML = r.links.map(function(l){
    var c = COLORS[l.color] || COLORS.mint || {bg:'#35D0A5',fg:'#0B2A22'};
    return '<a class="tile" href="'+esc(l.url)+'" target="_blank" rel="noopener" '+
      'style="background:'+c.bg+';color:'+c.fg+'">'+
      '<span class="t">'+esc(l.title)+'</span>'+
      (l.subtitle ? '<span class="s">'+esc(l.subtitle)+'</span>' : '')+
      '</a>';
  }).join('');
  $('foot').textContent = 'タップ すると あたらしい ページで ひらきます';
}

google.script.run.withSuccessHandler(function(r){
  if(!r.ok){ $('msg').textContent = r.msg; $('msg').classList.add('on'); return; }
  render(r);
}).withFailureHandler(function(){
  $('msg').textContent = 'つうしんに しっぱいしました。ページを ひらきなおして ください。';
  $('msg').classList.add('on');
}).boot();
</script>
</body>
</html>
